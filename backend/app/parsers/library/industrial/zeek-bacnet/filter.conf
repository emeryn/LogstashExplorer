filter {
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    add_field => { "[event][dataset]" => "zeek.bacnet" }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  mutate {
    rename => {
      "is_orig" => "[zeek][bacnet][is_orig]"
      "source_h" => "[zeek][bacnet][source_h]"
      "source_p" => "[zeek][bacnet][source_p]"
      "destination_h" => "[zeek][bacnet][destination_h]"
      "destination_p" => "[zeek][bacnet][destination_p]"
      "bvlc_function" => "[zeek][bacnet][bvlc_function]"
      "pdu_type" => "[zeek][bacnet][pdu_type]"
      "pdu_service" => "[zeek][bacnet][pdu_service]"
      "invoke_id" => "[zeek][bacnet][invoke_id]"
      "result_code" => "[zeek][bacnet][result_code]"
    }
  }
  mutate {
    copy => {
      "[zeek][bacnet][pdu_service]" => "[event][action]"
    }
    add_field => { "[network][transport]" => "tcp" }
  }
  if [zeek][bacnet][pdu_service] in ["write-property", "write-property-multiple", "reinitialize-device", "device-communication-control", "delete-object", "create-object", "atomic-write-file"] {
    mutate { add_tag => ["ot_critical_operation"] add_field => { "[event][type]" => "change" } }
  }
}

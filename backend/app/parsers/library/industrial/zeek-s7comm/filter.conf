filter {
  # Zeek JSON uses dotted keys ("id.orig_h"); nested objects ({"id": {"orig_h": …}}) are handled too.
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    rename => {
      "rosctr_name" => "[zeek][s7comm][rosctr]"
      "rosctr_code" => "[zeek][s7comm][rosctr_code]"
      "pdu_reference" => "[zeek][s7comm][pdu_reference]"
      "function_code" => "[zeek][s7comm][function_code]"
      "function_name" => "[zeek][s7comm][function]"
      "subfunction_code" => "[zeek][s7comm][subfunction_code]"
      "subfunction_name" => "[zeek][s7comm][subfunction]"
      "error_class" => "[zeek][s7comm][error_class]"
      "error_code" => "[zeek][s7comm][error_code]"
      "is_orig" => "[zeek][s7comm][is_orig]"
      "source_h" => "[zeek][s7comm][source_h]"
      "source_p" => "[zeek][s7comm][source_p]"
      "destination_h" => "[zeek][s7comm][destination_h]"
      "destination_p" => "[zeek][s7comm][destination_p]"
    }
    add_field => {
      "[network][protocol]" => "s7comm"
      "[network][transport]" => "tcp"
      "[event][dataset]" => "zeek.s7comm"
    }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  # Operations that change the process or the controller (writes, stop/restart, program download…).
  if [zeek][s7comm][function] in ["PLC_STOP", "PLC_CONTROL", "REQUEST_DOWNLOAD", "DOWNLOAD_BLOCK", "DOWNLOAD_ENDED", "WRITE_VAR", "DELETE_BLOCK", "PI_SERVICE"] {
    mutate { add_tag => ["ot_critical_operation"] add_field => { "[event][type]" => "change" } }
  }
}

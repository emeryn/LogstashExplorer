filter {
  # Zeek JSON uses dotted keys ("id.orig_h"); nested objects ({"id": {"orig_h": …}}) are handled too.
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    rename => {
      "fc_request" => "[zeek][dnp3][function_request]"
      "fc_reply" => "[zeek][dnp3][function_reply]"
      "iin" => "[zeek][dnp3][iin]"
    }
    add_field => {
      "[network][protocol]" => "dnp3"
      "[network][transport]" => "tcp"
      "[event][dataset]" => "zeek.dnp3"
    }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  # Operations that change the process or the controller (writes, stop/restart, program download…).
  if [zeek][dnp3][function_request] in ["WRITE", "SELECT", "OPERATE", "DIRECT_OPERATE", "DIRECT_OPERATE_NR", "COLD_RESTART", "WARM_RESTART", "INITIALIZE_DATA", "INITIALIZE_APPL", "START_APPL", "STOP_APPL", "ENABLE_UNSOLICITED", "DISABLE_UNSOLICITED"] {
    mutate { add_tag => ["ot_critical_operation"] add_field => { "[event][type]" => "change" } }
  }
}

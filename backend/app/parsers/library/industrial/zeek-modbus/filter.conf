filter {
  # Zeek JSON uses dotted keys ("id.orig_h"); nested objects ({"id": {"orig_h": …}}) are handled too.
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    rename => {
      "func" => "[zeek][modbus][function]"
      "exception" => "[zeek][modbus][exception]"
      "unit_id" => "[zeek][modbus][unit_id]"
      "tid" => "[zeek][modbus][transaction_id]"
    }
    add_field => {
      "[network][protocol]" => "modbus"
      "[network][transport]" => "tcp"
      "[event][dataset]" => "zeek.modbus"
    }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  # Operations that change the process or the controller (writes, stop/restart, program download…).
  if [zeek][modbus][function] in ["WRITE_SINGLE_COIL", "WRITE_SINGLE_REGISTER", "WRITE_MULTIPLE_COILS", "WRITE_MULTIPLE_REGISTERS", "READ_WRITE_MULTIPLE_REGISTERS", "MASK_WRITE_REGISTER", "WRITE_FILE_RECORD"] {
    mutate { add_tag => ["ot_critical_operation"] add_field => { "[event][type]" => "change" } }
  }
}

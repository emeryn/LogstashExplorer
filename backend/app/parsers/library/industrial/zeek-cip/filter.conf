filter {
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    add_field => { "[event][dataset]" => "zeek.cip" }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  mutate {
    rename => {
      "is_orig" => "[zeek][cip][is_orig]"
      "source_h" => "[zeek][cip][source_h]"
      "source_p" => "[zeek][cip][source_p]"
      "destination_h" => "[zeek][cip][destination_h]"
      "destination_p" => "[zeek][cip][destination_p]"
      "cip_sequence_count" => "[zeek][cip][cip_sequence_count]"
      "direction" => "[zeek][cip][direction]"
      "cip_service_code" => "[zeek][cip][cip_service_code]"
      "cip_service" => "[zeek][cip][cip_service]"
      "cip_status_code" => "[zeek][cip][cip_status_code]"
      "cip_status" => "[zeek][cip][cip_status]"
      "cip_extended_status_code" => "[zeek][cip][cip_extended_status_code]"
      "cip_extended_status" => "[zeek][cip][cip_extended_status]"
      "class_id" => "[zeek][cip][class_id]"
      "class_name" => "[zeek][cip][class_name]"
      "instance_id" => "[zeek][cip][instance_id]"
      "attribute_id" => "[zeek][cip][attribute_id]"
    }
  }
  mutate {
    copy => {
      "[zeek][cip][cip_service]" => "[event][action]"
      "[zeek][cip][cip_status]" => "[zeek][cip][status]"
    }
    add_field => { "[network][transport]" => "tcp" }
  }
  if [zeek][cip][cip_service] in ["Set_Attribute_Single", "Set_Attribute_All", "Set_Attributes_List", "Reset", "Apply_Attributes", "Create", "Delete", "Restore", "Write_Tag_Service", "Read_Modify_Write_Tag_Service"] {
    mutate { add_tag => ["ot_critical_operation"] add_field => { "[event][type]" => "change" } }
  }
}

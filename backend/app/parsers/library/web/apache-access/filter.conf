filter {
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^%{IPORHOST:[source][address]} (?:-|%{NOTSPACE:[apache][access][identity]}) (?:-|%{NOTSPACE:[user][name]}) \[%{HTTPDATE:[@metadata][timestamp]}\] "(?:%{WORD:[http][request][method]} %{NOTSPACE:[url][original]}(?: HTTP/%{NUMBER:[http][version]})?|%{DATA:[@metadata][invalid_request]})" %{INT:[http][response][status_code]:int} (?:-|%{INT:[http][response][body][bytes]:int})(?: "(?:-|%{DATA:[http][request][referrer]})" "(?:-|%{DATA:[user_agent][original]})")?'
    }
  }
  date {
    match => ["[@metadata][timestamp]", "dd/MMM/yyyy:HH:mm:ss Z"]
    target => "@timestamp"
  }
  if [source][address] =~ /^[0-9a-fA-F:.]+$/ {
    mutate { copy => { "[source][address]" => "[source][ip]" } }
  }
  if [user_agent][original] {
    useragent {
      ecs_compatibility => "v8"
      source => "[user_agent][original]"
      target => "[user_agent]"
    }
  }
  mutate { add_field => { "[event][dataset]" => "web.access" } }
}

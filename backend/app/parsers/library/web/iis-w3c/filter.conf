filter {
  if [message] =~ /^#/ {
    drop { }
  }
  dissect {
    mapping => {
      "message" => "%{[@metadata][date]} %{[@metadata][time]} %{[server][ip]} %{[http][request][method]} %{[url][path]} %{[url][query]} %{[server][port]} %{[user][name]} %{[source][ip]} %{[user_agent][original]} %{[http][request][referrer]} %{[http][response][status_code]} %{[iis][access][sub_status]} %{[iis][access][win32_status]} %{[iis][access][time_taken_ms]}"
    }
    convert_datatype => {
      "[server][port]" => "int"
      "[http][response][status_code]" => "int"
      "[iis][access][sub_status]" => "int"
      "[iis][access][win32_status]" => "int"
      "[iis][access][time_taken_ms]" => "int"
    }
  }
  # IIS writes "-" for empty values and "+" for spaces in the user agent.
  if [url][query] == "-" { mutate { remove_field => ["[url][query]"] } }
  if [user][name] == "-" { mutate { remove_field => ["[user][name]"] } }
  if [http][request][referrer] == "-" { mutate { remove_field => ["[http][request][referrer]"] } }
  mutate { gsub => ["[user_agent][original]", "\+", " "] }
  mutate {
    add_field => {
      "[@metadata][timestamp]" => "%{[@metadata][date]} %{[@metadata][time]}"
      "[event][dataset]" => "iis.access"
    }
  }
  date {
    match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss"]
    timezone => "UTC"
    target => "@timestamp"
  }
}

filter {
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^%{IPORHOST:[source][address]} (?:-|%{NOTSPACE:[apache][access][identity]}) (?:-|%{NOTSPACE:[user][name]}) \[%{HTTPDATE:[@metadata][timestamp]}\] "(?:%{WORD:[http][request][method]} %{NOTSPACE:[url][original]}(?: HTTP/%{NUMBER:[http][version]})?|%{DATA})" %{INT:[http][response][status_code]:int} (?:-|%{INT:[http][response][body][bytes]:int}) "(?:-|%{DATA:[http][request][referrer]})" "(?:-|%{DATA:[user_agent][original]})" %{INT:[traefik][access][request_count]:int} "(?:-|%{DATA:[traefik][access][router_name]})" "(?:-|%{DATA:[traefik][access][service_url]})" %{INT:[traefik][access][duration_ms]:int}ms$'
    }
  }
  if [source][address] =~ /^[0-9a-fA-F:.]+$/ {
    mutate { copy => { "[source][address]" => "[source][ip]" } }
  }
  date { match => ["[@metadata][timestamp]", "dd/MMM/yyyy:HH:mm:ss Z"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "traefik.access" } }
}

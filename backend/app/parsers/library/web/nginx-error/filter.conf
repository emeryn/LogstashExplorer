filter {
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^(?<[@metadata][timestamp]>%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}) \[%{LOGLEVEL:[log][level]}\] %{POSINT:[process][pid]:int}#%{NONNEGINT:[process][thread][id]:int}: (?:\*%{NONNEGINT:[nginx][error][connection_id]:int} )?%{GREEDYDATA:[@metadata][text]}'
    }
  }
  if [@metadata][text] {
    grok {
      ecs_compatibility => "v8"
      break_on_match => false
      tag_on_failure => []
      match => {
        "[@metadata][text]" => [
          '^(?<[error][message]>.*?)(?:, client: |$)',
          ', client: %{IPORHOST:[source][address]}',
          ', server: (?<[server][domain]>[^,]*)',
          ', request: "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]}(?: HTTP/%{NUMBER:[http][version]})?"',
          ', upstream: "(?<[nginx][error][upstream]>[^"]+)"',
          ', host: "(?<[url][domain]>[^"]+)"'
        ]
      }
    }
  }
  date {
    match => ["[@metadata][timestamp]", "yyyy/MM/dd HH:mm:ss"]
    target => "@timestamp"
  }
  if [source][address] =~ /^[0-9a-fA-F:.]+$/ {
    mutate { copy => { "[source][address]" => "[source][ip]" } }
  }
  mutate { add_field => { "[event][dataset]" => "web.error" } }
}

filter {
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^\[%{TIMESTAMP_ISO8601:[@metadata][timestamp]}\] "(?:%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} (?<[envoy][protocol]>\S+)|-)" %{INT:[http][response][status_code]:int} (?<[envoy][response_flags]>\S+) %{INT:[http][request][body][bytes]:int} %{INT:[http][response][body][bytes]:int} %{INT:[envoy][duration_ms]:int} (?:-|%{INT:[envoy][upstream_service_time_ms]:int}) "(?:-|(?<[envoy][x_forwarded_for]>[^"]*))" "(?:-|%{DATA:[user_agent][original]})" "(?:-|%{DATA:[http][request][id]})" "(?:-|%{DATA:[url][domain]})" "(?:-|%{DATA:[envoy][upstream_host]})"(?: %{GREEDYDATA:[envoy][extra]})?$'
    }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => { "[envoy][x_forwarded_for]" => '^%{IP:[source][ip]}' }
  }
  if [envoy][response_flags] == "-" { mutate { remove_field => ["[envoy][response_flags]"] } }
  date { match => ["[@metadata][timestamp]", "ISO8601"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "envoy.access" } }
}

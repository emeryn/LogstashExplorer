filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => {
      "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: )?%{IP:[source][ip]}:%{INT:[source][port]:int} \[%{HAPROXYDATE:[@metadata][timestamp]}\] %{NOTSPACE:[haproxy][frontend_name]} %{NOTSPACE:[haproxy][backend_name]}/%{NOTSPACE:[haproxy][server_name]} %{INT:[haproxy][http][request][time_wait_ms]:int}/%{INT:[haproxy][http][request][time_wait_without_data_ms]:int}/%{INT:[haproxy][connection_wait_time_ms]:int}/%{INT:[haproxy][http][response][time_wait_ms]:int}/\+?%{INT:[haproxy][total_time_ms]:int} %{INT:[http][response][status_code]:int} \+?%{INT:[http][response][bytes]:int} %{NOTSPACE:[haproxy][http][request][captured_cookie]} %{NOTSPACE:[haproxy][http][response][captured_cookie]} %{NOTSPACE:[haproxy][termination_state]} %{INT:[haproxy][connections][active]:int}/%{INT:[haproxy][connections][frontend]:int}/%{INT:[haproxy][connections][backend]:int}/%{INT:[haproxy][connections][server]:int}/\+?%{INT:[haproxy][connections][retries]:int} %{INT:[haproxy][server_queue]:int}/%{INT:[haproxy][backend_queue]:int} (?:\{%{DATA:[haproxy][http][request][captured_headers]}\} )?(?:\{%{DATA:[haproxy][http][response][captured_headers]}\} )?"(?:%{WORD:[http][request][method]} %{NOTSPACE:[url][original]}(?: HTTP/%{NUMBER:[http][version]})?|<BADREQ>)"'
    }
  }
  date {
    match => ["[@metadata][timestamp]", "dd/MMM/yyyy:HH:mm:ss.SSS"]
    target => "@timestamp"
  }
  mutate { add_field => { "[event][dataset]" => "haproxy.log" } }
}

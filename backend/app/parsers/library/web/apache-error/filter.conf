filter {
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^\[%{DAY} (?<[@metadata][timestamp]>%{MONTH} +%{MONTHDAY} %{TIME} %{YEAR})\] \[(?:%{WORD:[apache][error][module]}:)?%{WORD:[log][level]}\] \[pid %{POSINT:[process][pid]:int}(?::tid %{INT:[process][thread][id]:int})?\](?: \[client %{IPORHOST:[source][address]}(?::%{POSINT:[source][port]:int})?\])? (?:(?<[error][code]>AH\d{5}): )?%{GREEDYDATA:[@metadata][text]}'
    }
  }
  if [@metadata][text] {
    mutate {
      copy => { "message" => "[event][original]" }
    }
    mutate {
      replace => { "message" => "%{[@metadata][text]}" }
      gsub => ["[@metadata][timestamp]", "\.\d{3}(\d+)", ".\1", "[@metadata][timestamp]", " +", " "]
    }
  }
  date {
    match => ["[@metadata][timestamp]", "MMM d HH:mm:ss.SSS yyyy", "MMM d HH:mm:ss.SSSSSS yyyy", "MMM d HH:mm:ss yyyy"]
    target => "@timestamp"
  }
  if [source][address] =~ /^[0-9a-fA-F:.]+$/ {
    mutate { copy => { "[source][address]" => "[source][ip]" } }
  }
  mutate { add_field => { "[event][dataset]" => "web.error" } }
}

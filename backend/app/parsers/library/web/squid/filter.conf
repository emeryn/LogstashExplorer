filter {
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^%{NUMBER:[@metadata][epoch]}\s+%{INT:[squid][elapsed_ms]:int} %{IP:[source][ip]} %{WORD:[squid][cache_status]}/%{INT:[http][response][status_code]:int} %{INT:[http][response][bytes]:int} %{WORD:[http][request][method]} %{NOTSPACE:[url][original]} (?:-|%{NOTSPACE:[user][name]}) %{WORD:[squid][hierarchy_code]}/(?:-|%{IPORHOST:[destination][address]}) (?:-|%{NOTSPACE:[http][response][mime_type]})'
    }
  }
  date {
    match => ["[@metadata][epoch]", "UNIX"]
    target => "@timestamp"
  }
  mutate { add_field => { "[event][dataset]" => "squid.access" } }
}

filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  # EventID is either a number or {"#attributes": {"Qualifiers": n}, "#text": id}.
  if [Event][System][EventID][#text] {
    mutate { copy => { "[Event][System][EventID][#text]" => "[event][code]" } }
  } else {
    mutate { copy => { "[Event][System][EventID]" => "[event][code]" } }
  }
  mutate { convert => { "[event][code]" => "string" } }
  date {
    match => ["[Event][System][TimeCreated][#attributes][SystemTime]", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    rename => {
      "[Event][System][Computer]" => "[host][name]"
      "[Event][System][Channel]" => "[winlog][channel]"
      "[Event][System][Provider][#attributes][Name]" => "[winlog][provider_name]"
      "[Event][System][Provider][#attributes][Guid]" => "[winlog][provider_guid]"
      "[Event][System][EventRecordID]" => "[winlog][record_id]"
      "[Event][System][Execution][#attributes][ProcessID]" => "[winlog][process][pid]"
      "[Event][System][Execution][#attributes][ThreadID]" => "[winlog][process][thread][id]"
      "[Event][System][Security][#attributes][UserID]" => "[winlog][user][identifier]"
      "[Event][System][Level]" => "[winlog][level]"
      "[Event][System][Task]" => "[winlog][task]"
      "[Event][System][Opcode]" => "[winlog][opcode]"
      "[Event][System][Keywords]" => "[winlog][keywords]"
      "[Event][EventData]" => "[winlog][event_data]"
      "[Event][UserData]" => "[winlog][user_data]"
    }
  }
  mutate {
    remove_field => ["Event", "evtx"]
    copy => { "[winlog][provider_name]" => "[event][provider]" }
  }
  translate {
    source => "[winlog][level]"
    target => "[log][level]"
    dictionary => { "0" => "information" "1" => "critical" "2" => "error" "3" => "warning" "4" => "information" "5" => "verbose" }
  }
  if [winlog][keywords] == "0x8020000000000000" {
    mutate { add_field => { "[event][outcome]" => "success" } }
  } else if [winlog][keywords] == "0x8010000000000000" {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  }
  # Operational channel (4103/4104) uses named fields; the classic "Windows PowerShell" channel
  # (400/403/600/800) stores "key=value" details in the third unnamed data item.
  mutate {
    copy => {
      "[winlog][event_data][ScriptBlockText]" => "[powershell][file][script_block_text]"
      "[winlog][event_data][ScriptBlockId]" => "[powershell][file][script_block_id]"
      "[winlog][event_data][MessageNumber]" => "[powershell][sequence]"
      "[winlog][event_data][MessageTotal]" => "[powershell][total]"
      "[winlog][event_data][Path]" => "[file][path]"
      "[winlog][event_data][Payload]" => "[powershell][payload]"
      "[winlog][event_data][Data][#text][2]" => "[@metadata][details]"
      "[winlog][event_data][ContextInfo]" => "[@metadata][details]"
    }
  }
  if [@metadata][details] {
    kv {
      source => "[@metadata][details]"
      target => "[powershell][details]"
      field_split_pattern => "[\r\n\t]+"
      value_split_pattern => "\s*=\s*"
      trim_key => " "
      trim_value => " "
    }
    mutate {
      copy => {
        "[powershell][details][HostApplication]" => "[process][command_line]"
        "[powershell][details][Host Application]" => "[process][command_line]"
        "[powershell][details][EngineVersion]" => "[powershell][engine][version]"
        "[powershell][details][CommandLine]" => "[powershell][command][value]"
        "[powershell][details][Command Name]" => "[powershell][command][name]"
        "[powershell][details][User]" => "[user][name]"
      }
    }
  }
  translate {
    source => "[event][code]"
    target => "[event][action]"
    dictionary => {
      "400" => "engine-started" "403" => "engine-stopped" "600" => "provider-started" "800" => "pipeline-executed"
      "4103" => "execute-pipeline" "4104" => "execute-remote-command" "4105" => "started-command" "4106" => "stopped-command"
    }
  }
  mutate { add_field => { "[event][dataset]" => "windows.powershell" } }
}

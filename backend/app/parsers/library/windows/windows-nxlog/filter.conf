filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  mutate {
    copy => {
      "Hostname" => "[host][name]"
      "EventID" => "[event][code]"
      "SourceName" => "[winlog][provider_name]"
      "Channel" => "[winlog][channel]"
      "RecordNumber" => "[winlog][record_id]"
      "Category" => "[winlog][task]"
      "Message" => "message"
      "TargetUserName" => "[user][name]"
      "TargetDomainName" => "[user][domain]"
      "IpAddress" => "[source][ip]"
      "IpPort" => "[source][port]"
      "WorkstationName" => "[source][domain]"
      "LogonType" => "[winlog][logon][type]"
      "NewProcessName" => "[process][executable]"
      "CommandLine" => "[process][command_line]"
    }
  }
  mutate {
    convert => { "[event][code]" => "string" "[source][port]" => "integer" "[winlog][logon][type]" => "string" }
    copy => { "[winlog][provider_name]" => "[event][provider]" }
  }
  translate {
    source => "EventType"
    target => "[event][outcome]"
    dictionary => { "AUDIT_SUCCESS" => "success" "AUDIT_FAILURE" => "failure" }
  }
  translate {
    source => "Severity"
    target => "[log][level]"
    dictionary => { "DEBUG" => "verbose" "INFO" => "information" "WARNING" => "warning" "ERROR" => "error" "CRITICAL" => "critical" }
  }
  if [source][ip] in ["-", "::1", "127.0.0.1"] { mutate { remove_field => ["[source][ip]"] } }
  if [source][port] == 0 { mutate { remove_field => ["[source][port]"] } }
  # NXLog writes EventTime in the agent's local time zone, without offset: set `timezone` accordingly.
  date {
    match => ["EventTime", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "@timestamp"
  }
  mutate { add_field => { "[event][dataset]" => "windows.nxlog" } }
}

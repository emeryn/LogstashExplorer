filter {
  if [message] !~ /PACKET/ {
    drop { }
  }
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[@metadata][timestamp]>\d{1,2}/\d{1,2}/\d{4} \d{1,2}:\d{2}:\d{2}(?: [AP]M)?) (?<[windows][dns][thread_id]>[0-9A-F]+) PACKET +(?<[windows][dns][packet_id]>[0-9A-F]+) (?<[network][transport]>UDP|TCP) (?<[windows][dns][direction]>Rcv|Snd) (?<[client][ip]>[0-9a-fA-F:.]+) +(?<[dns][id]>[0-9a-fA-F]+) +(?:(?<[@metadata][qr]>R) )?(?<[dns][op_code]>[A-Z?]) \[(?<[windows][dns][flags_hex]>[0-9a-fA-F]+) +(?<[windows][dns][flags]>[A-Z ]*?) *(?<[dns][response_code]>[A-Z]+)\] (?<[dns][question][type]>\S+) +(?<[@metadata][qname]>\S+)\s*$' }
  }
  mutate {
    copy => { "[@metadata][qname]" => "[dns][question][name]" }
    lowercase => ["[network][transport]"]
  }
  mutate { gsub => ["[dns][question][name]", "\(\d+\)", "."] }
  mutate { gsub => ["[dns][question][name]", "^\.|\.$", ""] }
  if [@metadata][qr] == "R" {
    mutate { add_field => { "[dns][type]" => "answer" } }
  } else {
    mutate { add_field => { "[dns][type]" => "query" } }
  }
  date { match => ["[@metadata][timestamp]", "M/d/yyyy h:mm:ss a", "M/d/yyyy H:mm:ss", "d/M/yyyy H:mm:ss"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "windows.dns" } }
}

filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP} \S+ )?MSWinEventLog\t%{INT:[snare][criticality]:int}\t(?<[winlog][channel]>[^\t]*)\t%{INT:[snare][counter]:int}\t(?<[@metadata][timestamp]>[^\t]+)\t(?<[event][code]>\d+)\t(?<[winlog][provider_name]>[^\t]*)\t(?<[@metadata][user]>[^\t]*)\t(?<[snare][sid_type]>[^\t]*)\t(?<[@metadata][type]>[^\t]*)\t(?<[host][name]>[^\t]*)\t(?<[winlog][task]>[^\t]*)\t(?<[snare][data]>[^\t]*)\t(?<[@metadata][text]>[^\t]*)(?:\t(?<[snare][sequence]>\S*))?' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  if [@metadata][user] not in ["", "N/A", "Unknown User", "SYSTEM"] {
    mutate { copy => { "[@metadata][user]" => "[user][name]" } }
  }
  translate {
    source => "[@metadata][type]"
    target => "[event][outcome]"
    dictionary => { "Success Audit" => "success" "Failure Audit" => "failure" }
  }
  translate {
    source => "[event][code]"
    target => "[event][action]"
    dictionary => { "517" => "audit-log-cleared" "528" => "logged-in" "529" => "logon-failed" "530" => "logon-failed" "531" => "logon-failed" "532" => "logon-failed" "533" => "logon-failed" "534" => "logon-failed" "535" => "logon-failed" "536" => "logon-failed" "537" => "logon-failed" "538" => "logged-out" "539" => "logon-failed" "540" => "logged-in" "551" => "logged-out" "552" => "logged-in-explicit" "576" => "logged-in-special" "592" => "created-process" "593" => "exited-process" "612" => "changed-audit-config" "624" => "added-user-account" "626" => "enabled-user-account" "627" => "changed-password" "628" => "reset-password" "629" => "disabled-user-account" "630" => "deleted-user-account" "632" => "added-member-to-group" "636" => "added-member-to-group" "642" => "modified-user-account" "644" => "locked-out-user-account" "660" => "added-member-to-group" "671" => "unlocked-user-account" "672" => "kerberos-authentication-ticket-requested" "673" => "kerberos-service-ticket-requested" "675" => "kerberos-preauth-failed" "680" => "credential-validated" "1102" => "audit-log-cleared" "4624" => "logged-in" "4625" => "logon-failed" "4634" => "logged-out" "4672" => "logged-in-special" "4688" => "created-process" "4720" => "added-user-account" "4728" => "added-member-to-group" "4732" => "added-member-to-group" "4740" => "locked-out-user-account" "4768" => "kerberos-authentication-ticket-requested" "4769" => "kerberos-service-ticket-requested" "4776" => "credential-validated" }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    break_on_match => false
    match => {
      "message" => [
        '(?:Source Network Address|Client Address|Source Address):\s+(?:::ffff:)?%{IP:[source][ip]}',
        'Logon Type:\s+%{INT:[winlog][logon][type]}',
        '(?:Target Account Name|Member Name|Target Account ID):\s+(?<[user][target][name]>[^\s]+)',
        '(?:Image File Name|New Process Name):\s+(?<[process][executable]>\S.*?)(?:\s{2,}|$)'
      ]
    }
  }
  if [source][ip] in ["127.0.0.1", "-"] { mutate { remove_field => ["[source][ip]"] } }
  date { match => ["[@metadata][timestamp]", "EEE MMM dd HH:mm:ss yyyy", "EEE MMM d HH:mm:ss yyyy"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "windows.snare" } }
}

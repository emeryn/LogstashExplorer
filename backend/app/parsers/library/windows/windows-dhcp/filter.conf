filter {
  if [message] !~ /^\d{2},\d{2}\/\d{2}\/\d{2},/ {
    drop { }
  }
  csv {
    source => "message"
    target => "[@metadata][dhcp]"
    columns => ["id", "date", "time", "description", "ip", "host", "mac", "user", "transaction_id", "q_result",
                "probation_time", "correlation_id", "dhcid", "vendor_class_hex", "vendor_class", "user_class_hex",
                "user_class", "relay_agent", "dns_reg_error"]
    skip_empty_columns => true
  }
  mutate {
    copy => {
      "[@metadata][dhcp][id]" => "[event][code]"
      "[@metadata][dhcp][description]" => "[windows][dhcp][description]"
      "[@metadata][dhcp][ip]" => "[client][ip]"
      "[@metadata][dhcp][host]" => "[client][domain]"
      "[@metadata][dhcp][mac]" => "[client][mac]"
      "[@metadata][dhcp][user]" => "[user][name]"
      "[@metadata][dhcp][vendor_class]" => "[windows][dhcp][vendor_class]"
      "[@metadata][dhcp][transaction_id]" => "[windows][dhcp][transaction_id]"
    }
    add_field => { "[@metadata][timestamp]" => "%{[@metadata][dhcp][date]} %{[@metadata][dhcp][time]}" "[event][dataset]" => "windows.dhcp" }
  }
  translate {
    source => "[event][code]"
    target => "[event][action]"
    dictionary => {
      "00" => "log-started" "01" => "log-stopped" "02" => "log-paused" "10" => "assign" "11" => "renew"
      "12" => "release" "13" => "conflict" "14" => "scope-full" "15" => "denied" "16" => "deleted" "17" => "expired"
      "18" => "expired-deleted" "20" => "bootp-assign" "24" => "cleanup-started" "25" => "cleanup-stats"
      "30" => "dns-update-request" "31" => "dns-update-failed" "32" => "dns-update-successful"
    }
  }
  date { match => ["[@metadata][timestamp]", "MM/dd/yy HH:mm:ss"] target => "@timestamp" }
}

filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  # EventID is either a number or {"#attributes": {"Qualifiers": n}, "#text": id}.
  if [Event][System][EventID][#text] {
    mutate { copy => { "[Event][System][EventID][#text]" => "[event][code]" } }
  } else {
    mutate { copy => { "[Event][System][EventID]" => "[event][code]" } }
  }
  mutate { convert => { "[event][code]" => "string" } }
  date {
    match => ["[Event][System][TimeCreated][#attributes][SystemTime]", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    rename => {
      "[Event][System][Computer]" => "[host][name]"
      "[Event][System][Channel]" => "[winlog][channel]"
      "[Event][System][Provider][#attributes][Name]" => "[winlog][provider_name]"
      "[Event][System][Provider][#attributes][Guid]" => "[winlog][provider_guid]"
      "[Event][System][EventRecordID]" => "[winlog][record_id]"
      "[Event][System][Execution][#attributes][ProcessID]" => "[winlog][process][pid]"
      "[Event][System][Execution][#attributes][ThreadID]" => "[winlog][process][thread][id]"
      "[Event][System][Security][#attributes][UserID]" => "[winlog][user][identifier]"
      "[Event][System][Level]" => "[winlog][level]"
      "[Event][System][Task]" => "[winlog][task]"
      "[Event][System][Opcode]" => "[winlog][opcode]"
      "[Event][System][Keywords]" => "[winlog][keywords]"
      "[Event][EventData]" => "[winlog][event_data]"
      "[Event][UserData]" => "[winlog][user_data]"
    }
  }
  mutate {
    remove_field => ["Event", "evtx"]
    copy => { "[winlog][provider_name]" => "[event][provider]" }
  }
  translate {
    source => "[winlog][level]"
    target => "[log][level]"
    dictionary => { "0" => "information" "1" => "critical" "2" => "error" "3" => "warning" "4" => "information" "5" => "verbose" }
  }
  if [winlog][keywords] == "0x8020000000000000" {
    mutate { add_field => { "[event][outcome]" => "success" } }
  } else if [winlog][keywords] == "0x8010000000000000" {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  }
  translate {
    source => "[event][code]"
    target => "[event][action]"
    dictionary => {
      "1102" => "audit-log-cleared"
      "4624" => "logged-in" "4625" => "logon-failed" "4634" => "logged-out" "4647" => "logged-out"
      "4648" => "logged-in-explicit" "4672" => "logged-in-special" "4688" => "created-process"
      "4689" => "exited-process" "4697" => "service-installed" "4698" => "created-scheduled-task"
      "4719" => "changed-audit-config" "4720" => "added-user-account" "4722" => "enabled-user-account"
      "4723" => "changed-password" "4724" => "reset-password" "4725" => "disabled-user-account"
      "4726" => "deleted-user-account" "4728" => "added-member-to-group" "4729" => "removed-member-from-group"
      "4732" => "added-member-to-group" "4733" => "removed-member-from-group" "4738" => "modified-user-account"
      "4740" => "locked-out-user-account" "4756" => "added-member-to-group" "4757" => "removed-member-from-group"
      "4767" => "unlocked-user-account" "4768" => "kerberos-authentication-ticket-requested"
      "4769" => "kerberos-service-ticket-requested" "4771" => "kerberos-preauth-failed"
      "4776" => "credential-validated"
    }
  }
  # Who is `user`: the account that logged on, otherwise the actor (the target goes to user.target).
  if [event][code] in ["4624", "4625", "4634", "4647", "4768", "4769", "4771", "4776"] {
    mutate {
      copy => {
        "[winlog][event_data][TargetUserName]" => "[user][name]"
        "[winlog][event_data][TargetDomainName]" => "[user][domain]"
        "[winlog][event_data][TargetUserSid]" => "[user][id]"
      }
    }
  } else if [event][code] in ["4728", "4729", "4732", "4733", "4756", "4757"] {
    mutate {
      copy => {
        "[winlog][event_data][SubjectUserName]" => "[user][name]"
        "[winlog][event_data][SubjectDomainName]" => "[user][domain]"
        "[winlog][event_data][SubjectUserSid]" => "[user][id]"
        "[winlog][event_data][TargetUserName]" => "[group][name]"
        "[winlog][event_data][TargetDomainName]" => "[group][domain]"
        "[winlog][event_data][TargetSid]" => "[group][id]"
        "[winlog][event_data][MemberName]" => "[user][target][name]"
        "[winlog][event_data][MemberSid]" => "[user][target][id]"
      }
    }
  } else if [event][code] == "1102" {
    mutate {
      copy => {
        "[winlog][user_data][LogFileCleared][SubjectUserName]" => "[user][name]"
        "[winlog][user_data][LogFileCleared][SubjectDomainName]" => "[user][domain]"
        "[winlog][user_data][LogFileCleared][SubjectUserSid]" => "[user][id]"
      }
    }
  } else {
    mutate {
      copy => {
        "[winlog][event_data][SubjectUserName]" => "[user][name]"
        "[winlog][event_data][SubjectDomainName]" => "[user][domain]"
        "[winlog][event_data][SubjectUserSid]" => "[user][id]"
        "[winlog][event_data][TargetUserName]" => "[user][target][name]"
        "[winlog][event_data][TargetDomainName]" => "[user][target][domain]"
        "[winlog][event_data][TargetSid]" => "[user][target][id]"
      }
    }
  }
  mutate {
    copy => {
      "[winlog][event_data][IpAddress]" => "[source][ip]"
      "[winlog][event_data][IpPort]" => "[source][port]"
      "[winlog][event_data][WorkstationName]" => "[source][domain]"
      "[winlog][event_data][Workstation]" => "[source][domain]"
      "[winlog][event_data][LogonType]" => "[winlog][logon][type]"
      "[winlog][event_data][TargetLogonId]" => "[winlog][logon][id]"
      "[winlog][event_data][AuthenticationPackageName]" => "[winlog][logon][authentication_package]"
      "[winlog][event_data][Status]" => "[winlog][logon][failure][status]"
      "[winlog][event_data][SubStatus]" => "[winlog][logon][failure][sub_status]"
      "[winlog][event_data][NewProcessName]" => "[process][executable]"
      "[winlog][event_data][CommandLine]" => "[process][command_line]"
      "[winlog][event_data][ParentProcessName]" => "[process][parent][executable]"
      "[winlog][event_data][ServiceName]" => "[service][name]"
      "[winlog][event_data][TaskName]" => "[winlog][task_name]"
    }
  }
  if ![process][executable] and [winlog][event_data][ProcessName] and [winlog][event_data][ProcessName] != "-" {
    mutate { copy => { "[winlog][event_data][ProcessName]" => "[process][executable]" } }
  }
  if [user][name] == "-" { mutate { remove_field => ["[user][name]", "[user][domain]"] } }
  if [user][target][name] == "-" { mutate { remove_field => ["[user][target]"] } }
  # Kerberos events report IPv4 clients as IPv4-mapped IPv6; "-" / "::1" / port 0 mean "not available".
  mutate { gsub => ["[source][ip]", "^::ffff:", ""] }
  if [source][ip] in ["-", "::1", "127.0.0.1"] { mutate { remove_field => ["[source][ip]"] } }
  if [source][port] in ["-", "0"] { mutate { remove_field => ["[source][port]"] } }
  if [source][domain] == "-" { mutate { remove_field => ["[source][domain]"] } }
  mutate { convert => { "[source][port]" => "integer" "[winlog][logon][type]" => "string" } }
  translate {
    source => "[winlog][logon][type]"
    target => "[winlog][logon][type_name]"
    dictionary => {
      "2" => "Interactive" "3" => "Network" "4" => "Batch" "5" => "Service" "7" => "Unlock"
      "8" => "NetworkCleartext" "9" => "NewCredentials" "10" => "RemoteInteractive" "11" => "CachedInteractive"
    }
  }
  if [process][executable] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[process][executable]" => '(?<[process][name]>[^\\]+)$' }
    }
  }
  mutate { add_field => { "[event][dataset]" => "windows.security" } }
}

filter {
  if [message] =~ /^#/ {
    drop { }
  }
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[@metadata][timestamp]>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME}) (?<[event][action]>\S+) (?<[network][transport]>\S+) (?<[source][ip]>\S+) (?<[destination][ip]>\S+) (?:-|%{INT:[source][port]:int}) (?:-|%{INT:[destination][port]:int}) (?:-|%{INT:[windows][firewall][size]:int}) (?:-|(?<[windows][firewall][tcp_flags]>\S+)) \S+ \S+ \S+ \S+ \S+ \S+ (?<[@metadata][path]>SEND|RECEIVE|FORWARD|-)(?: (?:-|%{INT:[process][pid]:int}))?' }
  }
  translate {
    source => "[@metadata][path]"
    target => "[network][direction]"
    dictionary => { "SEND" => "outbound" "RECEIVE" => "inbound" "FORWARD" => "external" }
  }
  translate {
    source => "[event][action]"
    target => "[event][type]"
    dictionary => { "ALLOW" => "allowed" "DROP" => "denied" }
  }
  mutate { lowercase => ["[network][transport]", "[event][action]"] add_field => { "[event][dataset]" => "windows.firewall" } }
  date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
}

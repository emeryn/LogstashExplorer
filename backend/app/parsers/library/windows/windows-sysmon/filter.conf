filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  # EventID is either a number or {"#attributes": {"Qualifiers": n}, "#text": id}.
  if [Event][System][EventID][#text] {
    mutate { copy => { "[Event][System][EventID][#text]" => "[event][code]" } }
  } else {
    mutate { copy => { "[Event][System][EventID]" => "[event][code]" } }
  }
  mutate { convert => { "[event][code]" => "string" } }
  date {
    match => ["[Event][System][TimeCreated][#attributes][SystemTime]", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    rename => {
      "[Event][System][Computer]" => "[host][name]"
      "[Event][System][Channel]" => "[winlog][channel]"
      "[Event][System][Provider][#attributes][Name]" => "[winlog][provider_name]"
      "[Event][System][Provider][#attributes][Guid]" => "[winlog][provider_guid]"
      "[Event][System][EventRecordID]" => "[winlog][record_id]"
      "[Event][System][Execution][#attributes][ProcessID]" => "[winlog][process][pid]"
      "[Event][System][Execution][#attributes][ThreadID]" => "[winlog][process][thread][id]"
      "[Event][System][Security][#attributes][UserID]" => "[winlog][user][identifier]"
      "[Event][System][Level]" => "[winlog][level]"
      "[Event][System][Task]" => "[winlog][task]"
      "[Event][System][Opcode]" => "[winlog][opcode]"
      "[Event][System][Keywords]" => "[winlog][keywords]"
      "[Event][EventData]" => "[winlog][event_data]"
      "[Event][UserData]" => "[winlog][user_data]"
    }
  }
  mutate {
    remove_field => ["Event", "evtx"]
    copy => { "[winlog][provider_name]" => "[event][provider]" }
  }
  translate {
    source => "[winlog][level]"
    target => "[log][level]"
    dictionary => { "0" => "information" "1" => "critical" "2" => "error" "3" => "warning" "4" => "information" "5" => "verbose" }
  }
  if [winlog][keywords] == "0x8020000000000000" {
    mutate { add_field => { "[event][outcome]" => "success" } }
  } else if [winlog][keywords] == "0x8010000000000000" {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  }
  translate {
    source => "[event][code]"
    target => "[event][action]"
    dictionary => {
      "1" => "process-creation" "2" => "file-creation-time-changed" "3" => "network-connection"
      "5" => "process-terminated" "6" => "driver-loaded" "7" => "image-loaded" "8" => "create-remote-thread"
      "9" => "raw-access-read" "10" => "process-access" "11" => "file-create" "12" => "registry-object-added-or-deleted"
      "13" => "registry-value-set" "14" => "registry-object-renamed" "15" => "file-stream-create"
      "17" => "pipe-created" "18" => "pipe-connected" "22" => "dns-query" "23" => "file-delete"
      "25" => "process-tampering" "26" => "file-delete-detected"
    }
  }
  mutate {
    copy => {
      "[winlog][event_data][Image]" => "[process][executable]"
      "[winlog][event_data][CommandLine]" => "[process][command_line]"
      "[winlog][event_data][ProcessId]" => "[process][pid]"
      "[winlog][event_data][ProcessGuid]" => "[process][entity_id]"
      "[winlog][event_data][CurrentDirectory]" => "[process][working_directory]"
      "[winlog][event_data][ParentImage]" => "[process][parent][executable]"
      "[winlog][event_data][ParentCommandLine]" => "[process][parent][command_line]"
      "[winlog][event_data][ParentProcessId]" => "[process][parent][pid]"
      "[winlog][event_data][ParentProcessGuid]" => "[process][parent][entity_id]"
      "[winlog][event_data][OriginalFileName]" => "[process][pe][original_file_name]"
      "[winlog][event_data][IntegrityLevel]" => "[winlog][event_data][integrity_level]"
      "[winlog][event_data][SourceIp]" => "[source][ip]"
      "[winlog][event_data][SourcePort]" => "[source][port]"
      "[winlog][event_data][SourceHostname]" => "[source][domain]"
      "[winlog][event_data][DestinationIp]" => "[destination][ip]"
      "[winlog][event_data][DestinationPort]" => "[destination][port]"
      "[winlog][event_data][DestinationHostname]" => "[destination][domain]"
      "[winlog][event_data][Protocol]" => "[network][transport]"
      "[winlog][event_data][QueryName]" => "[dns][question][name]"
      "[winlog][event_data][QueryResults]" => "[winlog][event_data][query_results]"
      "[winlog][event_data][TargetFilename]" => "[file][path]"
      "[winlog][event_data][TargetObject]" => "[registry][path]"
      "[winlog][event_data][Details]" => "[registry][data][strings]"
      "[winlog][event_data][SourceImage]" => "[process][executable]"
      "[winlog][event_data][TargetImage]" => "[winlog][event_data][target_image]"
      "[winlog][event_data][RuleName]" => "[rule][name]"
    }
  }
  mutate { convert => { "[process][pid]" => "integer" "[process][parent][pid]" => "integer" "[source][port]" => "integer" "[destination][port]" => "integer" } }
  if [rule][name] == "-" { mutate { remove_field => ["[rule][name]"] } }
  if [winlog][event_data][User] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[winlog][event_data][User]" => '^(?:(?<[user][domain]>[^\\]+)\\)?(?<[user][name]>.+)$' }
    }
  }
  if [winlog][event_data][Hashes] {
    kv {
      source => "[winlog][event_data][Hashes]"
      target => "[process][hash]"
      field_split => ","
      value_split => "="
      transform_key => "lowercase"
      transform_value => "lowercase"
    }
  }
  if [process][executable] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[process][executable]" => '(?<[process][name]>[^\\]+)$' }
    }
  }
  mutate { add_field => { "[event][dataset]" => "windows.sysmon" } }
}

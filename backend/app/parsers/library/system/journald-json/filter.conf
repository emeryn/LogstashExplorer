filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  mutate {
    rename => {
      "__CURSOR" => "[journald][cursor]"
      "__REALTIME_TIMESTAMP" => "[journald][realtime_timestamp]"
      "__MONOTONIC_TIMESTAMP" => "[journald][monotonic_timestamp]"
      "_BOOT_ID" => "[journald][boot_id]"
      "_MACHINE_ID" => "[journald][machine_id]"
      "_HOSTNAME" => "[journald][hostname]"
      "PRIORITY" => "[journald][priority]"
      "SYSLOG_FACILITY" => "[journald][syslog_facility]"
      "SYSLOG_IDENTIFIER" => "[journald][syslog_identifier]"
      "SYSLOG_PID" => "[journald][syslog_pid]"
      "SYSLOG_TIMESTAMP" => "[journald][syslog_timestamp]"
      "MESSAGE" => "[journald][message]"
      "_PID" => "[journald][pid]"
      "_UID" => "[journald][uid]"
      "_GID" => "[journald][gid]"
      "_COMM" => "[journald][comm]"
      "_EXE" => "[journald][exe]"
      "_CMDLINE" => "[journald][cmdline]"
      "_CAP_EFFECTIVE" => "[journald][cap_effective]"
      "_SYSTEMD_CGROUP" => "[journald][systemd_cgroup]"
      "_SYSTEMD_UNIT" => "[journald][systemd_unit]"
      "_SYSTEMD_SLICE" => "[journald][systemd_slice]"
      "_SYSTEMD_INVOCATION_ID" => "[journald][systemd_invocation_id]"
      "_TRANSPORT" => "[journald][transport]"
      "_SELINUX_CONTEXT" => "[journald][selinux_context]"
      "_SOURCE_REALTIME_TIMESTAMP" => "[journald][source_realtime_timestamp]"
      "_STREAM_ID" => "[journald][stream_id]"
      "_RUNTIME_SCOPE" => "[journald][runtime_scope]"
      "CODE_FILE" => "[journald][code_file]"
      "CODE_LINE" => "[journald][code_line]"
      "CODE_FUNC" => "[journald][code_func]"
      "UNIT" => "[journald][unit]"
      "INVOCATION_ID" => "[journald][invocation_id]"
      "MESSAGE_ID" => "[journald][message_id]"
    }
  }
  mutate {
    copy => {
      "[journald][message]" => "message"
      "[journald][hostname]" => "[host][hostname]"
      "[journald][syslog_identifier]" => "[process][name]"
      "[journald][pid]" => "[process][pid]"
      "[journald][exe]" => "[process][executable]"
      "[journald][cmdline]" => "[process][command_line]"
      "[journald][systemd_unit]" => "[systemd][unit]"
      "[journald][uid]" => "[user][id]"
      "[journald][realtime_timestamp]" => "[@metadata][usec]"
    }
    add_field => { "[event][dataset]" => "journald.log" }
  }
  mutate { convert => { "[process][pid]" => "integer" } }
  translate {
    source => "[journald][priority]"
    target => "[log][level]"
    dictionary => { "0" => "emergency" "1" => "alert" "2" => "critical" "3" => "error" "4" => "warning" "5" => "notice" "6" => "informational" "7" => "debug" }
  }
  # __REALTIME_TIMESTAMP is in microseconds: keep milliseconds for the date filter.
  mutate { gsub => ["[@metadata][usec]", "\d{3}$", ""] }
  date { match => ["[@metadata][usec]", "UNIX_MS"] target => "@timestamp" }
}

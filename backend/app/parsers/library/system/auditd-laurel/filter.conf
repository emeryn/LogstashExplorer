filter {
  # LAUREL output (one audit event per line). Read as lines and decoded here so that its upper-case
  # record keys (SYSCALL, EXECVE, PATH…) stay together under auditd.laurel instead of at the root.
  json {
    source => "message"
    target => "[auditd][laurel]"
  }
  if [auditd][laurel][ID] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    # The first record after ID (and NODE) gives the event type: SYSCALL for syscall events, else the
    # user-space record (USER_LOGIN, ADD_USER…). It is renamed RECORD so one set of rules reads them all.
    mutate { copy => { "message" => "[@metadata][norm]" } }
    mutate {
      gsub => [ "[@metadata][norm]", '^(\{"ID":"[^"]*",(?:"NODE":"[^"]*",)?)"([A-Z0-9_]+)":', '\1"RECORD_TYPE":"\2","RECORD":' ]
    }
    json {
      source => "[@metadata][norm]"
      target => "[@metadata][ev]"
    }
    mutate { remove_field => ["message"] }
    # Most user-space records are objects, some (CONFIG_CHANGE…) lists of objects.
    if [@metadata][ev][RECORD][0] {
      mutate { copy => { "[@metadata][ev][RECORD][0]" => "[@metadata][r]" } }
    } else {
      mutate { copy => { "[@metadata][ev][RECORD]" => "[@metadata][r]" } }
    }

    dissect {
      mapping => { "[auditd][laurel][ID]" => "%{[@metadata][epoch]}:%{[auditd][sequence]}" }
      convert_datatype => { "[auditd][sequence]" => "int" }
    }
    date {
      match => ["[@metadata][epoch]", "UNIX"]
      target => "@timestamp"
    }

    if [auditd][laurel][NODE] {
      # Without ECS compatibility, inputs set `host` to a string (the Logstash host).
      if [host] =~ /./ { mutate { remove_field => ["host"] } }
      mutate { copy => { "[auditd][laurel][NODE]" => "[host][name]" } }
    }

    mutate {
      copy => {
        "[@metadata][ev][RECORD_TYPE]" => "[auditd][record_type]"
        "[@metadata][r][pid]" => "[process][pid]"
        "[@metadata][r][ppid]" => "[process][parent][pid]"
        "[@metadata][r][comm]" => "[process][name]"
        "[@metadata][r][uid]" => "[user][id]"
        "[@metadata][r][auid]" => "[user][audit][id]"
        "[@metadata][r][euid]" => "[user][effective][id]"
        "[@metadata][r][AUID]" => "[user][audit][name]"
        "[@metadata][r][ses]" => "[auditd][session]"
        "[@metadata][r][tty]" => "[auditd][tty]"
        "[@metadata][r][key]" => "[auditd][key]"
        "[@metadata][r][SYSCALL]" => "[auditd][syscall]"
        "[@metadata][r][PID][EVENT_ID]" => "[process][entity_id]"
        "[@metadata][r][SPAWNED_BY][EVENT_ID]" => "[process][parent][entity_id]"
        "[@metadata][r][SPAWNED_BY][exe]" => "[process][parent][executable]"
        "[@metadata][r][SPAWNED_BY][comm]" => "[process][parent][name]"
        "[@metadata][r][msg][acct]" => "[user][name]"
        "[@metadata][r][msg][addr]" => "[source][ip]"
        "[@metadata][r][msg][terminal]" => "[auditd][terminal]"
        "[@metadata][r][msg][cmd]" => "[auditd][cmd]"
        "[auditd][laurel][CWD][cwd]" => "[process][working_directory]"
        "[auditd][laurel][EXECVE][ARGV]" => "[process][args]"
        "[auditd][laurel][EXECVE][argc]" => "[process][args_count]"
      }
    }
    # Fallbacks: the executable of user-space records sits in msg, the account name in the
    # ENRICHED translation of uid, the working directory of USER_CMD in msg.
    if [@metadata][r][exe] {
      mutate { copy => { "[@metadata][r][exe]" => "[process][executable]" } }
    } else if [@metadata][r][msg][exe] {
      mutate { copy => { "[@metadata][r][msg][exe]" => "[process][executable]" } }
    }
    if ![user][name] and [@metadata][r][UID] {
      mutate { copy => { "[@metadata][r][UID]" => "[user][name]" } }
    }
    if ![process][working_directory] and [@metadata][r][msg][cwd] {
      mutate { copy => { "[@metadata][r][msg][cwd]" => "[process][working_directory]" } }
    }
    if ![process][parent][executable] and [@metadata][r][PPID][exe] {
      mutate { copy => { "[@metadata][r][PPID][exe]" => "[process][parent][executable]" } }
    }
    if [@metadata][r][PID][container][id] {
      mutate { copy => { "[@metadata][r][PID][container][id]" => "[container][id]" } }
    }
    # Process labels (label-keys, label-exe… in laurel.conf) become tags.
    if [@metadata][r][LABELS] {
      mutate { merge => { "tags" => "[@metadata][r][LABELS]" } }
    }
    mutate { convert => { "[user][id]" => "string" "[user][audit][id]" => "string" "[user][effective][id]" => "string" } }
    # 4294967295 (-1) means "unset" for auid and session.
    if [user][audit][id] == "4294967295" {
      if [user][audit][name] {
        mutate { remove_field => ["[user][audit][id]"] }
      } else {
        mutate { remove_field => ["[user][audit]"] }
      }
    }
    if [auditd][session] == 4294967295 { mutate { remove_field => ["[auditd][session]"] } }

    # Command line: EXECVE.ARGV_STR (execve-argv = ["array", "string"]), else the joined ARGV, else PROCTITLE.
    if [auditd][laurel][EXECVE][ARGV_STR] {
      mutate { copy => { "[auditd][laurel][EXECVE][ARGV_STR]" => "[process][command_line]" } }
    } else if [auditd][laurel][EXECVE][ARGV] {
      mutate { copy => { "[auditd][laurel][EXECVE][ARGV]" => "[@metadata][argv]" } }
    } else if [auditd][laurel][PROCTITLE][ARGV] {
      mutate { copy => { "[auditd][laurel][PROCTITLE][ARGV]" => "[@metadata][argv]" } }
    }
    if [@metadata][argv] {
      mutate { join => { "[@metadata][argv]" => " " } }
      mutate { copy => { "[@metadata][argv]" => "[process][command_line]" } }
    }

    # Files: the last PATH item is the object of the syscall (the first ones are parent directories).
    # For execve it is the program loader instead, and the program is already process.executable.
    if [auditd][laurel][PATH] and [auditd][syscall] !~ /^execve/ {
      mutate { copy => { "[auditd][laurel][PATH][-1][name]" => "[file][path]" } }
    }

    # Network: decoded socket address (needs `universal = true` in laurel.conf).
    if [auditd][laurel][SOCKADDR][0][SADDR][addr] {
      if [auditd][syscall] in ["accept", "accept4", "recvfrom", "recvmsg"] {
        mutate { copy => { "[auditd][laurel][SOCKADDR][0][SADDR][addr]" => "[source][ip]" "[auditd][laurel][SOCKADDR][0][SADDR][port]" => "[source][port]" } }
      } else if [auditd][syscall] == "bind" {
        mutate { copy => { "[auditd][laurel][SOCKADDR][0][SADDR][addr]" => "[server][ip]" "[auditd][laurel][SOCKADDR][0][SADDR][port]" => "[server][port]" } }
      } else {
        mutate { copy => { "[auditd][laurel][SOCKADDR][0][SADDR][addr]" => "[destination][ip]" "[auditd][laurel][SOCKADDR][0][SADDR][port]" => "[destination][port]" } }
      }
    }

    # Action: the syscall name, else the user-space operation, else the record type.
    if [auditd][syscall] {
      mutate { copy => { "[auditd][syscall]" => "[event][action]" } }
    } else if [@metadata][r][msg][op] {
      mutate { copy => { "[@metadata][r][msg][op]" => "[event][action]" } }
    } else if [@metadata][r][op] {
      mutate { copy => { "[@metadata][r][op]" => "[event][action]" } }
    } else {
      mutate { copy => { "[auditd][record_type]" => "[event][action]" } }
      mutate { lowercase => ["[event][action]"] }
    }

    if [@metadata][r][success] == "yes" or [@metadata][r][msg][res] == "success" or [@metadata][r][res] == 1 {
      mutate { add_field => { "[event][outcome]" => "success" } }
    } else if [@metadata][r][success] == "no" or [@metadata][r][msg][res] == "failed" or [@metadata][r][res] == 0 {
      mutate { add_field => { "[event][outcome]" => "failure" } }
    }

    if [auditd][syscall] =~ /^execve/ {
      mutate { add_field => { "[event][category]" => "process" } }
    } else if [auditd][syscall] in ["connect", "accept", "accept4", "bind", "listen", "sendto", "sendmsg", "recvfrom", "recvmsg"] {
      mutate { add_field => { "[event][category]" => "network" } }
    } else if [file][path] {
      mutate { add_field => { "[event][category]" => "file" } }
    } else if [auditd][record_type] =~ /^(?:USER_(?:AUTH|ACCT|LOGIN|LOGOUT|START|END|ERR)|CRED_|LOGIN$)/ {
      mutate { add_field => { "[event][category]" => "authentication" } }
    } else if [auditd][record_type] =~ /^(?:ADD|DEL)_(?:USER|GROUP)$|^(?:USER|GRP)_(?:MGMT|CHAUTHTOK)$|^ACCT_/ {
      mutate { add_field => { "[event][category]" => "iam" } }
    } else if [auditd][record_type] in ["CONFIG_CHANGE", "DAEMON_CONFIG", "USYS_CONFIG"] {
      mutate { add_field => { "[event][category]" => "configuration" } }
    }
  }
}

filter {
  if [message] =~ /^\s*\{/ {
    mutate { copy => { "message" => "[@metadata][json]" } }
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { remove_field => ["message"] }
    json {
      source => "[@metadata][json]"
      skip_on_invalid_json => false
    }
    if [timestamp] {
      date { match => ["timestamp", "ISO8601", "UNIX", "UNIX_MS"] target => "@timestamp" }
    } else if [time] {
      date { match => ["time", "ISO8601", "UNIX", "UNIX_MS"] target => "@timestamp" }
    } else if [ts] {
      date { match => ["ts", "ISO8601", "UNIX", "UNIX_MS"] target => "@timestamp" }
    }
  }
}

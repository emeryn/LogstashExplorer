filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^header,\d+,\d+,(?<[event][action]>[^,]+),(?<[solaris][bsm][modifier]>[^,]*),%{IPORHOST:[host][hostname]},(?<[@metadata][timestamp]>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME})(?: (?<[@metadata][tz]>[+-]\d{2}:?\d{2}))?' }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    break_on_match => false
    match => {
      "message" => [
        ',subject,(?<[user][audit][name]>[^,]+),(?<[user][effective][name]>[^,]+),[^,]*,(?<[user][name]>[^,]+),[^,]*,%{INT:[process][pid]:int},%{INT:[solaris][bsm][session_id]:int},\d+ \d+ (?<[source][address]>[^,]+)',
        ',return,(?<[@metadata][result]>success|failure)(?:[^,]*),(?<[solaris][bsm][return_value]>-?\d+)',
        ',path,(?<[file][path]>[^,]+)',
        ',exec_args,\d+,(?<[@metadata][args]>.*?),(?:subject|return|attribute|path),'
      ]
    }
  }
  if [@metadata][args] {
    mutate { split => { "[@metadata][args]" => "," } }
    mutate { copy => { "[@metadata][args]" => "[process][args]" } }
  }
  if [source][address] =~ /^[0-9a-fA-F:.]+$/ and [source][address] != "0.0.0.0" {
    mutate { copy => { "[source][address]" => "[source][ip]" } }
  }
  translate {
    source => "[@metadata][result]"
    target => "[event][outcome]"
    dictionary => { "success" => "success" "failure" => "failure" }
  }
  if [@metadata][tz] {
    mutate { replace => { "[@metadata][timestamp]" => "%{[@metadata][timestamp]} %{[@metadata][tz]}" } }
  }
  date {
    match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss.SSS ZZ", "yyyy-MM-dd HH:mm:ss ZZ", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss"]
    target => "@timestamp"
  }
  mutate { add_field => { "[event][dataset]" => "solaris.bsm" } }
}

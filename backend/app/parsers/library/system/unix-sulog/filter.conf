filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^SU (?<[@metadata][timestamp]>\d{2}/\d{2} \d{2}:\d{2}) (?<[@metadata][result]>[+-]) (?<[sulog][tty]>\S+) (?<[user][name]>[^\s-]+)-(?<[user][target][name]>\S+)$' }
  }
  translate {
    source => "[@metadata][result]"
    target => "[event][outcome]"
    dictionary => { "+" => "success" "-" => "failure" }
  }
  mutate { add_field => { "[event][action]" => "su" "[event][dataset]" => "unix.sulog" } }
  date { match => ["[@metadata][timestamp]", "MM/dd HH:mm"] target => "@timestamp" }
}

filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:1 )?%{TIMESTAMP_ISO8601:[@metadata][timestamp]} %{IPORHOST:[host][hostname]} (?<[process][name]>[\w.-]+)(?:\[%{POSINT:[process][pid]:int}\])?:? (?:-  - )?(?:(?<[log][level]>verbose|info|warning|error|critical|In\(\d+\)|Wa\(\d+\)|Er\(\d+\)|Db\(\d+\)) )?(?:(?<[esxi][process]>[\w-]+)\[%{POSINT:[esxi][pid]:int}\]:? )?(?:\[Originator@6876(?<[@metadata][orig]>[^\]]*)\] )?%{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  if [@metadata][orig] {
    kv {
      source => "[@metadata][orig]"
      target => "[@metadata][originator]"
      field_split => " "
      value_split => "="
      whitespace => "strict"
    }
    mutate {
      copy => {
        "[@metadata][originator][sub]" => "[esxi][sub]"
        "[@metadata][originator][opID]" => "[esxi][op_id]"
        "[@metadata][originator][user]" => "[esxi][user]"
      }
    }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => {
      "message" => [
        'User (?<[user][name]>[^@\s]+)@%{IP:[source][ip]} logged (?<[@metadata][inout]>in|out)',
        'Accepted (?<[esxi][auth_method]>\S+) for (?<[user][name]>\S+) from %{IP:[source][ip]} port',
        'Failed (?<[esxi][auth_method]>\S+) for (?<[user][name]>\S+) from %{IP:[source][ip]} port'
      ]
    }
  }
  if [@metadata][inout] {
    mutate { add_field => { "[event][action]" => "logged-%{[@metadata][inout]}" } }
  }
  if ![user][name] and [esxi][user] {
    mutate { copy => { "[esxi][user]" => "[user][name]" } }
  }
  date { match => ["[@metadata][timestamp]", "ISO8601"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "vmware.esxi" } }
}

filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?%{SYSLOGTIMESTAMP:[@metadata][timestamp]} %{IPORHOST:[host][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  date {
    match => ["[@metadata][timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
    target => "@timestamp"
  }
  if [process][name] == "sshd" {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => {
        "message" => [
          '^(?<[event][action]>Accepted) %{WORD:[system][auth][ssh][method]} for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]:int} ssh2(?:: %{GREEDYDATA:[system][auth][ssh][signature]})?',
          '^(?<[event][action]>Failed) %{WORD:[system][auth][ssh][method]} for (?:invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]:int} ssh2',
          '^(?<[event][action]>Invalid) user %{USERNAME:[user][name]}? from %{IP:[source][ip]}(?: port %{INT:[source][port]:int})?',
          '^(?<[event][action]>Disconnected) from (?:authenticating |invalid )?user %{USERNAME:[user][name]} %{IP:[source][ip]} port %{INT:[source][port]:int}'
        ]
      }
    }
    translate {
      source => "[event][action]"
      target => "[event][outcome]"
      dictionary => { "Accepted" => "success" "Failed" => "failure" "Invalid" => "failure" "Disconnected" => "unknown" }
      override => true
    }
    translate {
      source => "[event][action]"
      target => "[event][action]"
      dictionary => { "Accepted" => "ssh_login" "Failed" => "ssh_login" "Invalid" => "ssh_login" "Disconnected" => "ssh_logout" }
      override => true
    }
  } else if [process][name] == "sudo" {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => {
        "message" => '^\s*%{USERNAME:[user][name]} : (?:%{DATA:[system][auth][sudo][error]} ; )?TTY=%{NOTSPACE:[system][auth][sudo][tty]} ; PWD=%{DATA:[system][auth][sudo][pwd]} ; USER=%{USERNAME:[user][effective][name]} ; (?:GROUP=%{DATA} ; )?COMMAND=%{GREEDYDATA:[process][command_line]}'
      }
      add_field => { "[event][action]" => "sudo" }
    }
    if [system][auth][sudo][error] {
      mutate { add_field => { "[event][outcome]" => "failure" } }
    } else if [process][command_line] {
      mutate { add_field => { "[event][outcome]" => "success" } }
    }
  } else if [process][name] in ["useradd", "groupadd"] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => {
        "message" => [
          '^new user: name=%{USERNAME:[user][name]}, UID=%{INT:[user][id]}, GID=%{INT:[group][id]}',
          '^new group: name=%{USERNAME:[group][name]}, GID=%{INT:[group][id]}'
        ]
      }
      add_field => { "[event][action]" => "%{[process][name]}" "[event][outcome]" => "success" }
    }
  }
  if [message] =~ /^pam_unix\(/ {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => {
        "message" => '^pam_unix\(%{DATA:[system][auth][pam][module]}\): (?:session (?<[event][action]>opened|closed) for user %{USERNAME:[user][name]}|authentication failure;.*?(?: user=%{USERNAME:[user][name]})?$)'
      }
    }
  }
}

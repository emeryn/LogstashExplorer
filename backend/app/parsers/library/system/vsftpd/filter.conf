filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^%{DAY} (?<[@metadata][timestamp]>%{MONTH} +%{MONTHDAY} %{TIME} %{YEAR}) \[pid %{POSINT:[process][pid]:int}\] (?:\[(?<[user][name]>[^\]]+)\] )?(?:(?<[@metadata][result]>OK|FAIL) )?(?<[event][action]>[A-Z]+(?: [A-Z]+)?): Client "(?:::ffff:)?%{IP:[source][ip]}"(?:, "(?<[file][path]>[^"]+)"(?:, %{INT:[file][size]:int} bytes)?)?' }
  }
  translate {
    source => "[@metadata][result]"
    target => "[event][outcome]"
    dictionary => { "OK" => "success" "FAIL" => "failure" }
  }
  mutate { lowercase => ["[event][action]"] gsub => ["[@metadata][timestamp]", " +", " "] add_field => { "[event][dataset]" => "vsftpd.log" } }
  date { match => ["[@metadata][timestamp]", "MMM d HH:mm:ss yyyy"] target => "@timestamp" }
}

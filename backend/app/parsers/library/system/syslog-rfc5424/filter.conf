filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => {
      "message" => '^<%{NONNEGINT:[log][syslog][priority]:int}>%{NONNEGINT:[log][syslog][version]} (?:-|%{TIMESTAMP_ISO8601:[@metadata][timestamp]}) (?:-|%{IPORHOST:[host][hostname]}) (?:-|%{NOTSPACE:[log][syslog][appname]}) (?:-|%{NOTSPACE:[log][syslog][procid]}) (?:-|%{NOTSPACE:[log][syslog][msgid]}) (?:-|(?<[@metadata][sd]>(?:\[(?:[^\]\\"]|\\.|"(?:[^"\\]|\\.)*")*\])+))(?: %{GREEDYDATA:[@metadata][text]})?$'
    }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  if [@metadata][sd] {
    # "[id1 a="1"][id2 b="2"]" -> "id1 a="1" id2 b="2"": SD-IDs carry no "=" and are ignored by kv.
    mutate { gsub => ["[@metadata][sd]", "^\[|\]$", "", "[@metadata][sd]", "\]\s*\[", " "] }
    kv {
      source => "[@metadata][sd]"
      target => "[log][syslog][structured_data]"
      field_split => " "
      value_split => "="
    }
  }
  date {
    match => ["[@metadata][timestamp]", "ISO8601"]
    target => "@timestamp"
  }
  syslog_pri {
    ecs_compatibility => "v8"
    syslog_pri_field_name => "[log][syslog][priority]"
  }
}

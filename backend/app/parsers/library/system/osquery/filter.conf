filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  mutate {
    rename => {
      "name" => "[osquery][result][name]" "hostIdentifier" => "[osquery][result][host_identifier]"
      "calendarTime" => "[osquery][result][calendar_time]" "unixTime" => "[osquery][result][unix_time]"
      "epoch" => "[osquery][result][epoch]" "counter" => "[osquery][result][counter]"
      "numerics" => "[osquery][result][numerics]" "decorations" => "[osquery][result][decorations]"
      "columns" => "[osquery][result][columns]" "snapshot" => "[osquery][result][snapshot]"
      "action" => "[osquery][result][action]"
    }
  }
  mutate {
    copy => {
      "[osquery][result][host_identifier]" => "[host][name]"
      "[osquery][result][name]" => "[rule][name]"
      "[osquery][result][action]" => "[event][action]"
    }
    add_field => { "[event][dataset]" => "osquery.result" }
  }
  date { match => ["[osquery][result][unix_time]", "UNIX"] target => "@timestamp" }
}

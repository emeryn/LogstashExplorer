filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} (?<[process][name]>[^\s:\[]+)(?:\[%{POSINT:[process][pid]:int}\])?: \[ID %{INT:[solaris][msgid]} (?<[log][syslog][facility][name]>\w+)\.(?<[log][level]>\w+)\] %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => {
      "message" => [
        '^(?<[@metadata][auth]>Accepted) %{WORD:[@metadata][method]} for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]:int}',
        '^(?<[@metadata][auth]>Failed) %{WORD:[@metadata][method]} for (?:invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]:int}',
        "^'su (?<[user][target][name]>\S+)' (?<[@metadata][su]>succeeded|failed) for (?<[user][name]>\S+) on (?<[@metadata][tty]>\S+)",
        '^(?<[@metadata][root_login]>ROOT LOGIN) (?<[@metadata][tty]>\S+)(?: FROM (?<[source][address]>\S+))?'
      ]
    }
  }
  if [@metadata][auth] == "Accepted" or [@metadata][su] == "succeeded" or [@metadata][root_login] {
    mutate { add_field => { "[event][outcome]" => "success" } }
  } else if [@metadata][auth] == "Failed" or [@metadata][su] == "failed" {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  }
  if [@metadata][su] {
    mutate { add_field => { "[event][action]" => "su" } }
  } else if [@metadata][auth] or [@metadata][root_login] {
    mutate { add_field => { "[event][action]" => "login" } }
  }
  if [@metadata][root_login] {
    mutate { add_field => { "[user][name]" => "root" } }
  }
  date { match => ["[@metadata][syslog_timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "solaris.syslog" } }
}

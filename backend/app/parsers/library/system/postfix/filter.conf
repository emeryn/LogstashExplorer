filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => {
      "message" => [
        '^(?:dis)?connect from (?<[source][domain]>[^\[\s]+)\[%{IP:[source][ip]}\]',
        '^NOQUEUE: reject: RCPT from (?<[source][domain]>[^\[\s]+)\[%{IP:[source][ip]}\]: (?<[postfix][dsn]>\d{3} [\d.]+) (?<[postfix][response]>[^;]+); from=<(?<[email][from][address]>[^>]*)> to=<(?<[email][to][address]>[^>]*)>',
        '^warning: (?<[source][domain]>[^\[\s]+)\[%{IP:[source][ip]}\]: SASL (?<[postfix][sasl_method]>\S+) authentication failed',
        '^(?<[postfix][queue_id]>[0-9A-F]{6,}|[0-9a-zA-Z]{10,}): client=(?<[source][domain]>[^\[\s]+)\[%{IP:[source][ip]}\](?:, sasl_method=(?<[postfix][sasl_method]>[^,]+), sasl_username=(?<[user][name]>\S+))?',
        '^(?<[postfix][queue_id]>[0-9A-F]{6,}|[0-9a-zA-Z]{10,}): from=<(?<[email][from][address]>[^>]*)>, size=%{INT:[email][size]:int}, nrcpt=%{INT:[postfix][nrcpt]:int}',
        '^(?<[postfix][queue_id]>[0-9A-F]{6,}|[0-9a-zA-Z]{10,}): to=<(?<[email][to][address]>[^>]*)>,(?: orig_to=<[^>]*>,)? relay=(?<[postfix][relay]>[^,]+),(?: conn_use=\d+,)? delay=%{NUMBER:[postfix][delay]:float}, delays=[^,]+, dsn=(?<[postfix][dsn]>[\d.]+), status=%{WORD:[postfix][status]} \((?<[postfix][response]>.*)\)',
        '^(?<[postfix][queue_id]>[0-9A-F]{6,}|[0-9a-zA-Z]{10,}): message-id=<(?<[email][message_id]>[^>]*)>'
      ]
    }
  }
  if [postfix][status] == "sent" {
    mutate { add_field => { "[event][outcome]" => "success" } }
  } else if [postfix][status] in ["bounced", "deferred"] or [message] =~ /^NOQUEUE: reject|authentication failed/ {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  }
  date { match => ["[@metadata][syslog_timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "postfix.log" } }
}

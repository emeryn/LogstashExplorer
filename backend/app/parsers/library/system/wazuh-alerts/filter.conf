filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  mutate {
    rename => {
      "timestamp" => "[wazuh][timestamp]" "rule" => "[wazuh][rule]" "agent" => "[wazuh][agent]"
      "manager" => "[wazuh][manager]" "id" => "[wazuh][id]" "full_log" => "[wazuh][full_log]"
      "decoder" => "[wazuh][decoder]" "data" => "[wazuh][data]" "location" => "[wazuh][location]"
      "predecoder" => "[wazuh][predecoder]" "syscheck" => "[wazuh][syscheck]"
    }
  }
  mutate {
    copy => {
      "[wazuh][rule][id]" => "[rule][id]"
      "[wazuh][rule][description]" => "[rule][name]"
      "[wazuh][rule][level]" => "[event][severity]"
      "[wazuh][agent][name]" => "[host][name]"
      "[wazuh][agent][ip]" => "[host][ip]"
      "[wazuh][data][srcip]" => "[source][ip]"
      "[wazuh][data][dstuser]" => "[user][name]"
      "[wazuh][rule][mitre][id]" => "[threat][technique][id]"
      "[wazuh][id]" => "[event][id]"
    }
    add_field => { "[event][kind]" => "alert" "[event][dataset]" => "wazuh.alerts" }
  }
  date { match => ["[wazuh][timestamp]", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"] target => "@timestamp" }
}

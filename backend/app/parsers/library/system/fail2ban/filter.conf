filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[@metadata][timestamp]>%{TIMESTAMP_ISO8601}) (?<[log][logger]>fail2ban\.\S+) +\[%{POSINT:[process][pid]:int}\]: %{LOGLEVEL:[log][level]} +(?:\[(?<[fail2ban][jail]>[^\]]+)\] )?%{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => { "message" => '^(?<[event][action]>Restore Ban|Already banned|Ban|Unban|Found|Ignore) %{IP:[source][ip]}' }
  }
  mutate { lowercase => ["[log][level]", "[event][action]"] add_field => { "[event][dataset]" => "fail2ban.log" } }
  date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss,SSS"] target => "@timestamp" }
}

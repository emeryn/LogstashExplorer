filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} named(?:\[%{POSINT:[process][pid]:int}\])?: )?(?:(?<[@metadata][timestamp]>%{MONTHDAY}-%{MONTH}-%{YEAR} %{TIME}) )?(?:queries: %{LOGLEVEL:[log][level]}: )?client (?:@0x[0-9a-f]+ )?%{IP:[source][ip]}#%{INT:[source][port]:int} \((?<[dns][question][name]>[^)]+)\): (?:view (?<[bind][view]>\S+): )?query: \S+ (?<[dns][question][class]>\S+) (?<[dns][question][type]>\S+) (?<[bind][flags]>\S+) \(%{IP:[server][ip]}\)' }
  }
  date { match => ["[@metadata][timestamp]", "dd-MMM-yyyy HH:mm:ss.SSS"] target => "@timestamp" }
  date { match => ["[@metadata][syslog_timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "bind.query" } }
}

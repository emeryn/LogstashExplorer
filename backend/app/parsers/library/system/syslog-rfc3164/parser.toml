name = "Syslog (RFC 3164 / BSD)"
vendor = "Linux, network devices, appliances"
description = """
Classic BSD syslog lines (`<PRI>Mmm dd hh:mm:ss host program[pid]: message`), with or without the priority.
Decodes facility and severity, keeps the original line in `event.original` and the text in `message`.
RFC 3164 timestamps carry neither year nor time zone: the year is inferred and the pipeline time zone applies.
"""
input_format = "lines"
priority = -1  # generic syslog: dedicated syslog-based parsers win score ties
detect = ['^(?:<\d{1,3}>)?\w{3} [ \d]\d \d{2}:\d{2}:\d{2} \S+ [^\s:\[]+(?:\[\d+\])?: ']
fields = ["host.hostname", "process.name", "process.pid", "log.syslog.priority", "log.syslog.facility.name",
          "log.syslog.severity.name", "message", "event.original"]

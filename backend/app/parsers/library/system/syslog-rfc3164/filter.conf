filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?%{SYSLOGTIMESTAMP:[@metadata][timestamp]} %{IPORHOST:[host][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  date {
    match => ["[@metadata][timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
    target => "@timestamp"
  }
  if [log][syslog][priority] {
    syslog_pri {
      ecs_compatibility => "v8"
      syslog_pri_field_name => "[log][syslog][priority]"
    }
  }
}

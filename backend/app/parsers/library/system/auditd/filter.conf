filter {
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^(?:node=%{NOTSPACE:[auditd][log][node]} )?type=%{WORD:[@metadata][record_type]} msg=audit\(%{NUMBER:[@metadata][epoch]}:%{INT:[@metadata][sequence]:int}\): ?%{GREEDYDATA:[@metadata][kv]}'
    }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[auditd][log]"
    field_split => " "
    value_split => "="
  }
  # USER_* records nest their own key=value list in msg='…'.
  if [auditd][log][msg] {
    kv {
      source => "[auditd][log][msg]"
      target => "[auditd][log]"
      field_split => " "
      value_split => "="
    }
    mutate { remove_field => ["[auditd][log][msg]"] }
  }
  mutate {
    copy => { "[@metadata][record_type]" => "[auditd][log][record_type]" "[@metadata][sequence]" => "[auditd][log][sequence]" }
  }
  date {
    match => ["[@metadata][epoch]", "UNIX"]
    target => "@timestamp"
  }
  mutate {
    copy => {
      "[auditd][log][pid]" => "[process][pid]"
      "[auditd][log][ppid]" => "[process][parent][pid]"
      "[auditd][log][exe]" => "[process][executable]"
      "[auditd][log][comm]" => "[process][name]"
      "[auditd][log][uid]" => "[user][id]"
      "[auditd][log][auid]" => "[user][audit][id]"
      "[auditd][log][euid]" => "[user][effective][id]"
      "[auditd][log][acct]" => "[user][name]"
      "[auditd][log][addr]" => "[source][ip]"
    }
  }
  mutate { convert => { "[process][pid]" => "integer" "[process][parent][pid]" => "integer" } }
  if [source][ip] == "?" { mutate { remove_field => ["[source][ip]"] } }
  if [auditd][log][success] == "yes" or [auditd][log][res] in ["success", "1"] {
    mutate { add_field => { "[event][outcome]" => "success" } }
  } else if [auditd][log][success] == "no" or [auditd][log][res] in ["failed", "0"] {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  }
}

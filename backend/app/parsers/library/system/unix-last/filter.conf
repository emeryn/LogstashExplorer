filter {
  if [message] =~ /^(?:wtmp|btmp|wtmpx) begins/ or [message] =~ /^\s*$/ {
    drop { }
  }
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[user][name]>\S+)\s+(?<[last][tty]>system boot|\S+)\s+(?:(?<[source][address]>\S+)\s+)?(?<[@metadata][timestamp]>%{DAY} %{MONTH} +%{MONTHDAY} %{HOUR}:%{MINUTE})(?:\s+-\s+(?<[@metadata][end]>%{HOUR}:%{MINUTE}|crash|down|shutdown))?\s*(?:\((?<[last][duration]>[^)]+)\)|(?<[last][state]>still logged in|still running|gone - no logout))?\s*$' }
  }
  if [user][name] in ["reboot", "shutdown"] {
    mutate { add_field => { "[event][action]" => "%{[user][name]}" } remove_field => ["[user][name]"] }
  } else {
    mutate { add_field => { "[event][action]" => "login" } }
  }
  # For reboot records the host column holds the kernel release.
  if [last][tty] == "system boot" {
    mutate { rename => { "[source][address]" => "[last][kernel]" } }
  }
  if [@metadata][end] in ["crash", "down", "shutdown"] {
    mutate { copy => { "[@metadata][end]" => "[last][state]" } }
  }
  if [source][address] =~ /^[0-9a-fA-F:.]+$/ {
    mutate { copy => { "[source][address]" => "[source][ip]" } }
  }
  mutate { gsub => ["[@metadata][timestamp]", " +", " "] add_field => { "[event][dataset]" => "unix.last" } }
  date { match => ["[@metadata][timestamp]", "EEE MMM d HH:mm"] target => "@timestamp" }
}

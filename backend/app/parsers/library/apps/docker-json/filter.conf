filter {
  # The file input sets [log][file][path] (ECS) or path (ECS disabled).
  if [path] and ![log][file][path] {
    mutate { copy => { "path" => "[log][file][path]" } }
  }
  json {
    source => "message"
    target => "[@metadata][docker]"
  }
  if [@metadata][docker][log] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate {
      replace => { "message" => "%{[@metadata][docker][log]}" }
      copy => { "[@metadata][docker][stream]" => "[log][iostream]" }
      add_field => { "[event][dataset]" => "docker.container_logs" }
    }
    mutate { gsub => ["message", "\r?\n$", ""] }
    date { match => ["[@metadata][docker][time]", "ISO8601"] target => "@timestamp" }
  }
  if [log][file][path] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[log][file][path]" => '/containers/(?<[container][id]>[0-9a-f]{64})/' }
    }
  }
}

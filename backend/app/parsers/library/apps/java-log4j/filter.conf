filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[@metadata][timestamp]>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}[ T]%{HOUR}:%{MINUTE}:%{SECOND}) +%{LOGLEVEL:[log][level]} +\[(?<[process][thread][name]>[^\]]+)\] +(?<[log][logger]>[\w.$]+)(?::\d+)? +- +%{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  date {
    match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601"]
    target => "@timestamp"
  }
  mutate { add_field => { "[event][dataset]" => "java.log" } }
}

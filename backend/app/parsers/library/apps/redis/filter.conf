filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^%{POSINT:[process][pid]:int}:(?<[@metadata][role]>[XCSM]) (?<[@metadata][timestamp]>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME}) (?<[@metadata][level]>[.\-*#]) %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  translate {
    source => "[@metadata][role]"
    target => "[redis][log][role]"
    dictionary => { "M" => "master" "S" => "replica" "C" => "child" "X" => "sentinel" }
  }
  translate {
    source => "[@metadata][level]"
    target => "[log][level]"
    dictionary => { "." => "debug" "-" => "verbose" "*" => "notice" "#" => "warning" }
  }
  date { match => ["[@metadata][timestamp]", "dd MMM yyyy HH:mm:ss.SSS"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "redis.log" } }
}

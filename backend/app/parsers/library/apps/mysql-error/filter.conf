filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^%{TIMESTAMP_ISO8601:[@metadata][timestamp]} %{INT:[mysql][thread_id]:int} \[%{WORD:[log][level]}\] \[(?<[error][code]>MY-\d+)\] \[%{WORD:[mysql][subsystem]}\] %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => { "message" => "^Access denied for user '(?<[user][name]>[^']*)'@'(?<[source][address]>[^']*)'" }
    add_field => { "[event][outcome]" => "failure" "[event][action]" => "authentication" }
  }
  mutate { lowercase => ["[log][level]"] }
  date { match => ["[@metadata][timestamp]", "ISO8601"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "mysql.error" } }
}

filter {
  mutate {
    rename => {
      "t" => "[mongodb][log][t]" "s" => "[mongodb][log][severity]" "c" => "[mongodb][log][component]"
      "id" => "[mongodb][log][id]" "ctx" => "[mongodb][log][context]" "msg" => "[mongodb][log][message]"
      "attr" => "[mongodb][log][attr]" "tags" => "[mongodb][log][tags]" "truncated" => "[mongodb][log][truncated]"
    }
  }
  mutate {
    copy => {
      "[mongodb][log][message]" => "message"
      "[mongodb][log][id]" => "[event][code]"
      "[mongodb][log][attr][principalName]" => "[user][name]"
      "[mongodb][log][attr][user]" => "[user][name]"
      "[mongodb][log][attr][remote]" => "[@metadata][remote]"
      "[mongodb][log][attr][client]" => "[@metadata][remote]"
    }
    add_field => { "[event][dataset]" => "mongodb.log" }
  }
  mutate { convert => { "[event][code]" => "string" } }
  translate {
    source => "[mongodb][log][severity]"
    target => "[log][level]"
    dictionary => { "F" => "fatal" "E" => "error" "W" => "warning" "I" => "info" "D1" => "debug" "D2" => "debug" "D3" => "debug" "D4" => "debug" "D5" => "debug" }
  }
  if [@metadata][remote] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[@metadata][remote]" => ['^%{IP:[source][ip]}:%{INT:[source][port]:int}$', '^\[%{IP:[source][ip]}\]:%{INT:[source][port]:int}$'] }
    }
  }
  if [message] == "Authentication succeeded" {
    mutate { add_field => { "[event][outcome]" => "success" "[event][action]" => "authentication" } }
  } else if [message] == "Authentication failed" {
    mutate { add_field => { "[event][outcome]" => "failure" "[event][action]" => "authentication" } }
  }
  date { match => ["[mongodb][log][t][$date]", "ISO8601"] target => "@timestamp" }
}

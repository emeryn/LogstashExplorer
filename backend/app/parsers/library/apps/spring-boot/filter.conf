filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^%{TIMESTAMP_ISO8601:[@metadata][timestamp]} +%{LOGLEVEL:[log][level]} +%{POSINT:[process][pid]:int} --- (?:\[(?<[service][name]>[^\]]*)\] )?\[ *(?<[process][thread][name]>[^\]]*?)\] +(?<[log][logger]>\S+) +: %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  date { match => ["[@metadata][timestamp]", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "spring_boot.log" } }
}

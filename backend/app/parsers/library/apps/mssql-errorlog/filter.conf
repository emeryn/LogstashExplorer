filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[@metadata][timestamp]>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME}) (?<[mssql][log][origin]>\S+) +%{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    break_on_match => false
    match => {
      "message" => [
        "^Login (?<[@metadata][result]>failed|succeeded) for user '(?<[user][name]>[^']*)'",
        '\[CLIENT: %{IP:[source][ip]}\]',
        '^Error: %{INT:[error][code]}, Severity: %{INT:[mssql][log][severity]:int}, State: %{INT:[mssql][log][state]:int}'
      ]
    }
  }
  if [@metadata][result] == "failed" {
    mutate { add_field => { "[event][outcome]" => "failure" "[event][action]" => "login" } }
  } else if [@metadata][result] == "succeeded" {
    mutate { add_field => { "[event][outcome]" => "success" "[event][action]" => "login" } }
  }
  date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss.SS"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "mssql.log" } }
}

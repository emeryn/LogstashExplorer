filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^\[(?<[@metadata][timestamp]>%{TIMESTAMP_ISO8601})\] %{LOGLEVEL:[log][level]} (?:\[(?<[kafka][log][component]>[^\]]+)\] )?%{GREEDYDATA:[@metadata][text]} \((?<[log][logger]>[\w.$]+)\)$' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss,SSS"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "kafka.log" } }
}

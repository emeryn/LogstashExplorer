filter {
  # The file input sets [log][file][path] (ECS) or path (ECS disabled).
  if [path] and ![log][file][path] {
    mutate { copy => { "path" => "[log][file][path]" } }
  }
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^%{TIMESTAMP_ISO8601:[@metadata][timestamp]} (?<[log][iostream]>stdout|stderr) (?<[@metadata][tag]>[FP]) %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  if [@metadata][tag] == "P" {
    mutate { add_tag => ["partial"] }
  }
  date { match => ["[@metadata][timestamp]", "ISO8601"] target => "@timestamp" }
  if [log][file][path] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => {
        "[log][file][path]" => '/(?<[kubernetes][pod][name]>[^/_]+)_(?<[kubernetes][namespace]>[^_]+)_(?<[kubernetes][container][name]>.+)-(?<[container][id]>[0-9a-f]{64})\.log$'
      }
    }
  }
  mutate { add_field => { "[event][dataset]" => "kubernetes.container_logs" } }
}

filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[@metadata][timestamp]>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME}) (?<[postgresql][log][timezone]>[A-Z]{2,5}|[+-]\d{2}(?::?\d{2})?) \[%{POSINT:[process][pid]:int}\] (?:(?<[user][name]>[^@\s]+)@(?<[postgresql][log][database]>\S+) )?(?<[log][level]>[A-Z]+\d?): +%{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  if ![user][name] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => {
        "message" => [
          '^connection authorized: user=(?<[user][name]>\S+) database=(?<[postgresql][log][database]>\S+)',
          'authentication failed for user "(?<[user][name]>[^"]+)"'
        ]
      }
    }
  }
  if [message] =~ /authentication failed/ {
    mutate { add_field => { "[event][outcome]" => "failure" "[event][action]" => "authentication" } }
  } else if [message] =~ /^connection authorized/ {
    mutate { add_field => { "[event][outcome]" => "success" "[event][action]" => "authentication" } }
  }
  mutate { lowercase => ["[log][level]"] }
  date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "postgresql.log" } }
}

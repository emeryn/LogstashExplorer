filter {
  mutate {
    rename => {
      "time" => "[azure][activitylogs][time]"
      "resourceId" => "[azure][activitylogs][resourceId]"
      "operationName" => "[azure][activitylogs][operationName]"
      "category" => "[azure][activitylogs][category]"
      "resultType" => "[azure][activitylogs][resultType]"
      "resultSignature" => "[azure][activitylogs][resultSignature]"
      "durationMs" => "[azure][activitylogs][durationMs]"
      "callerIpAddress" => "[azure][activitylogs][callerIpAddress]"
      "correlationId" => "[azure][activitylogs][correlationId]"
      "identity" => "[azure][activitylogs][identity]"
      "level" => "[azure][activitylogs][level]"
      "location" => "[azure][activitylogs][location]"
      "properties" => "[azure][activitylogs][properties]"
    }
  }
  mutate {
    copy => {
      "[azure][activitylogs][operationName]" => "[event][action]"
      "[azure][activitylogs][callerIpAddress]" => "[source][ip]"
      "[azure][activitylogs][identity][claims][name]" => "[user][full_name]"
      "[azure][activitylogs][resourceId]" => "[azure][resource][id]"
      "[azure][activitylogs][correlationId]" => "[event][id]"
    }
    add_field => { "[cloud][provider]" => "azure" "[event][dataset]" => "azure.activitylogs" }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => { "[azure][resource][id]" => '(?i)^/subscriptions/(?<[cloud][account][id]>[^/]+)(?:/resourcegroups/(?<[azure][resource][group]>[^/]+))?' }
  }
  translate {
    source => "[azure][activitylogs][resultType]"
    target => "[event][outcome]"
    dictionary => { "Success" => "success" "Succeeded" => "success" "Failure" => "failure" "Failed" => "failure" "Start" => "unknown" "Accept" => "unknown" }
  }
  date { match => ["[azure][activitylogs][time]", "ISO8601"] target => "@timestamp" }
}

filter {
  mutate {
    rename => {
      "protoPayload" => "[gcp][audit_raw][protoPayload]"
      "insertId" => "[gcp][audit_raw][insertId]"
      "resource" => "[gcp][audit_raw][resource]"
      "logName" => "[gcp][audit_raw][logName]"
      "receiveTimestamp" => "[gcp][audit_raw][receiveTimestamp]"
      "severity" => "[gcp][audit_raw][severity]"
      "operation" => "[gcp][audit_raw][operation]"
      "timestamp" => "[gcp][audit_raw][timestamp]"
    }
  }
  mutate {
    rename => { "[gcp][audit_raw][protoPayload]" => "[gcp][audit]" }
  }
  mutate {
    copy => {
      "[gcp][audit][authenticationInfo][principalEmail]" => "[user][email]"
      "[gcp][audit][requestMetadata][callerIp]" => "[source][ip]"
      "[gcp][audit][requestMetadata][callerSuppliedUserAgent]" => "[user_agent][original]"
      "[gcp][audit][methodName]" => "[event][action]"
      "[gcp][audit][serviceName]" => "[event][provider]"
      "[gcp][audit_raw][resource][labels][project_id]" => "[cloud][project][id]"
      "[gcp][audit_raw][severity]" => "[log][level]"
      "[gcp][audit_raw][insertId]" => "[event][id]"
    }
    add_field => { "[cloud][provider]" => "gcp" "[event][dataset]" => "gcp.audit" }
  }
  mutate { copy => { "[user][email]" => "[user][name]" } lowercase => ["[log][level]"] }
  if [gcp][audit][status][code] and [gcp][audit][status][code] != 0 {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  } else {
    mutate { add_field => { "[event][outcome]" => "success" } }
  }
  date { match => ["[gcp][audit_raw][timestamp]", "ISO8601"] target => "@timestamp" }
}

filter {
  dissect {
    mapping => {
      "message" => "%{[aws][vpcflow][version]} %{[cloud][account][id]} %{[aws][vpcflow][interface_id]} %{[@metadata][srcaddr]} %{[@metadata][dstaddr]} %{[@metadata][srcport]} %{[@metadata][dstport]} %{[@metadata][protocol]} %{[@metadata][packets]} %{[@metadata][bytes]} %{[@metadata][start]} %{[@metadata][end]} %{[@metadata][action]} %{[aws][vpcflow][log_status]}"
    }
  }
  if [aws][vpcflow][log_status] == "OK" {
    mutate {
      copy => {
        "[@metadata][srcaddr]" => "[source][ip]"
        "[@metadata][dstaddr]" => "[destination][ip]"
        "[@metadata][srcport]" => "[source][port]"
        "[@metadata][dstport]" => "[destination][port]"
        "[@metadata][protocol]" => "[network][iana_number]"
        "[@metadata][packets]" => "[network][packets]"
        "[@metadata][bytes]" => "[network][bytes]"
      }
    }
    mutate {
      convert => {
        "[source][port]" => "integer" "[destination][port]" => "integer"
        "[network][packets]" => "integer" "[network][bytes]" => "integer"
      }
      lowercase => ["[@metadata][action]"]
    }
    translate {
      source => "[network][iana_number]"
      target => "[network][transport]"
      dictionary => { "1" => "icmp" "6" => "tcp" "17" => "udp" "47" => "gre" "50" => "esp" "58" => "ipv6-icmp" }
    }
    mutate { copy => { "[@metadata][action]" => "[event][action]" } }
    translate {
      source => "[@metadata][action]"
      target => "[event][type]"
      dictionary => { "accept" => "allowed" "reject" => "denied" }
    }
  }
  date { match => ["[@metadata][start]", "UNIX"] target => "@timestamp" }
  date { match => ["[@metadata][end]", "UNIX"] target => "[event][end]" }
  mutate { add_field => { "[cloud][provider]" => "aws" "[event][dataset]" => "aws.vpcflow" } }
}

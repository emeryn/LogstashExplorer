filter {
  # EventBridge wrapper: keep the envelope aside and work on the finding.
  if [detail][type] {
    mutate { rename => { "source" => "[aws][eventbridge][source]" "detail-type" => "[aws][eventbridge][detail_type]" "detail" => "[@metadata][finding]" } }
  } else {
    mutate {
      rename => {
        "schemaVersion" => "[@metadata][finding][schemaVersion]" "accountId" => "[@metadata][finding][accountId]"
        "region" => "[@metadata][finding][region]" "partition" => "[@metadata][finding][partition]"
        "id" => "[@metadata][finding][id]" "arn" => "[@metadata][finding][arn]" "type" => "[@metadata][finding][type]"
        "resource" => "[@metadata][finding][resource]" "service" => "[@metadata][finding][service]"
        "severity" => "[@metadata][finding][severity]" "createdAt" => "[@metadata][finding][createdAt]"
        "updatedAt" => "[@metadata][finding][updatedAt]" "title" => "[@metadata][finding][title]"
        "description" => "[@metadata][finding][description]"
      }
    }
  }
  mutate { remove_field => ["version", "id", "account", "time", "region", "resources"] }
  mutate { rename => { "[@metadata][finding]" => "[aws][guardduty]" } }
  mutate {
    copy => {
      "[aws][guardduty][type]" => "[rule][name]"
      "[aws][guardduty][id]" => "[event][id]"
      "[aws][guardduty][title]" => "message"
      "[aws][guardduty][severity]" => "[event][severity]"
      "[aws][guardduty][accountId]" => "[cloud][account][id]"
      "[aws][guardduty][region]" => "[cloud][region]"
      "[aws][guardduty][service][action][portProbeAction][portProbeDetails][0][remoteIpDetails][ipAddressV4]" => "[source][ip]"
      "[aws][guardduty][service][action][networkConnectionAction][remoteIpDetails][ipAddressV4]" => "[source][ip]"
      "[aws][guardduty][service][action][awsApiCallAction][remoteIpDetails][ipAddressV4]" => "[source][ip]"
    }
    add_field => { "[event][kind]" => "alert" "[cloud][provider]" => "aws" "[event][dataset]" => "aws.guardduty" }
  }
  mutate { convert => { "[event][severity]" => "integer" } }
  date { match => ["[aws][guardduty][updatedAt]", "ISO8601"] target => "@timestamp" }
}

filter {
  mutate {
    rename => {
      "kind" => "[kubernetes][audit][kind]"
      "apiVersion" => "[kubernetes][audit][apiVersion]"
      "level" => "[kubernetes][audit][level]"
      "auditID" => "[kubernetes][audit][auditID]"
      "stage" => "[kubernetes][audit][stage]"
      "requestURI" => "[kubernetes][audit][requestURI]"
      "verb" => "[kubernetes][audit][verb]"
      "user" => "[kubernetes][audit][user]"
      "impersonatedUser" => "[kubernetes][audit][impersonatedUser]"
      "sourceIPs" => "[kubernetes][audit][sourceIPs]"
      "userAgent" => "[kubernetes][audit][userAgent]"
      "objectRef" => "[kubernetes][audit][objectRef]"
      "responseStatus" => "[kubernetes][audit][responseStatus]"
      "requestObject" => "[kubernetes][audit][requestObject]"
      "responseObject" => "[kubernetes][audit][responseObject]"
      "requestReceivedTimestamp" => "[kubernetes][audit][requestReceivedTimestamp]"
      "stageTimestamp" => "[kubernetes][audit][stageTimestamp]"
      "annotations" => "[kubernetes][audit][annotations]"
    }
  }
  mutate {
    copy => {
      "[kubernetes][audit][verb]" => "[event][action]"
      "[kubernetes][audit][auditID]" => "[event][id]"
      "[kubernetes][audit][user][username]" => "[user][name]"
      "[kubernetes][audit][sourceIPs][0]" => "[source][ip]"
      "[kubernetes][audit][userAgent]" => "[user_agent][original]"
      "[kubernetes][audit][requestURI]" => "[url][original]"
      "[kubernetes][audit][objectRef][namespace]" => "[kubernetes][namespace]"
      "[kubernetes][audit][responseStatus][code]" => "[http][response][status_code]"
    }
    add_field => { "[event][dataset]" => "kubernetes.audit" }
  }
  if [http][response][status_code] {
    if [http][response][status_code] >= 400 {
      mutate { add_field => { "[event][outcome]" => "failure" } }
    } else {
      mutate { add_field => { "[event][outcome]" => "success" } }
    }
  }
  date { match => ["[kubernetes][audit][requestReceivedTimestamp]", "ISO8601"] target => "@timestamp" }
}

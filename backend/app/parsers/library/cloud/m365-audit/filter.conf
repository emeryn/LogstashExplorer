filter {
  mutate {
    rename => {
      "CreationTime" => "[o365][audit][CreationTime]"
      "Id" => "[o365][audit][Id]"
      "Operation" => "[o365][audit][Operation]"
      "OrganizationId" => "[o365][audit][OrganizationId]"
      "RecordType" => "[o365][audit][RecordType]"
      "UserKey" => "[o365][audit][UserKey]"
      "UserType" => "[o365][audit][UserType]"
      "Version" => "[o365][audit][Version]"
      "Workload" => "[o365][audit][Workload]"
      "ClientIP" => "[o365][audit][ClientIP]"
      "ObjectId" => "[o365][audit][ObjectId]"
      "UserId" => "[o365][audit][UserId]"
      "CorrelationId" => "[o365][audit][CorrelationId]"
      "EventSource" => "[o365][audit][EventSource]"
      "ItemType" => "[o365][audit][ItemType]"
      "SiteUrl" => "[o365][audit][SiteUrl]"
      "SourceFileName" => "[o365][audit][SourceFileName]"
      "SourceRelativeUrl" => "[o365][audit][SourceRelativeUrl]"
      "UserAgent" => "[o365][audit][UserAgent]"
      "ResultStatus" => "[o365][audit][ResultStatus]"
      "LogonError" => "[o365][audit][LogonError]"
      "Parameters" => "[o365][audit][Parameters]"
      "ExternalAccess" => "[o365][audit][ExternalAccess]"
      "OrganizationName" => "[o365][audit][OrganizationName]"
      "OriginatingServer" => "[o365][audit][OriginatingServer]"
      "AzureActiveDirectoryEventType" => "[o365][audit][AzureActiveDirectoryEventType]"
      "ExtendedProperties" => "[o365][audit][ExtendedProperties]"
      "ActorContextId" => "[o365][audit][ActorContextId]"
      "ActorIpAddress" => "[o365][audit][ActorIpAddress]"
      "InterSystemsId" => "[o365][audit][InterSystemsId]"
      "IntraSystemId" => "[o365][audit][IntraSystemId]"
      "Target" => "[o365][audit][Target]"
      "TargetContextId" => "[o365][audit][TargetContextId]"
      "ApplicationId" => "[o365][audit][ApplicationId]"
      "DeviceProperties" => "[o365][audit][DeviceProperties]"
      "ErrorNumber" => "[o365][audit][ErrorNumber]"
      "Actor" => "[o365][audit][Actor]"
    }
  }
  mutate {
    copy => {
      "[o365][audit][Operation]" => "[event][action]"
      "[o365][audit][Workload]" => "[event][provider]"
      "[o365][audit][Id]" => "[event][id]"
      "[o365][audit][UserId]" => "[user][name]"
      "[o365][audit][UserAgent]" => "[user_agent][original]"
      "[o365][audit][SourceFileName]" => "[file][name]"
      "[o365][audit][ClientIP]" => "[@metadata][client_ip]"
      "[o365][audit][ActorIpAddress]" => "[@metadata][client_ip]"
    }
    add_field => { "[event][dataset]" => "o365.audit" }
  }
  if [@metadata][client_ip] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[@metadata][client_ip]" => ['^\[(?<[source][ip]>[0-9a-fA-F:]+)\](?::\d+)?$', '^(?<[source][ip]>\d+\.\d+\.\d+\.\d+)(?::\d+)?$', '^(?<[source][ip]>[0-9a-fA-F:]+)$'] }
    }
  }
  translate {
    source => "[o365][audit][ResultStatus]"
    target => "[event][outcome]"
    dictionary => { "Succeeded" => "success" "Success" => "success" "True" => "success" "PartiallySucceeded" => "success" "Failed" => "failure" "False" => "failure" }
    fallback => "unknown"
  }
  date { match => ["[o365][audit][CreationTime]", "ISO8601"] timezone => "UTC" target => "@timestamp" }
}

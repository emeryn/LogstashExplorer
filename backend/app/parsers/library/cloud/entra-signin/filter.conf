filter {
  mutate {
    rename => {
      "time" => "[azure][signinlogs][time]"
      "resourceId" => "[azure][signinlogs][resourceId]"
      "operationName" => "[azure][signinlogs][operationName]"
      "operationVersion" => "[azure][signinlogs][operationVersion]"
      "category" => "[azure][signinlogs][category]"
      "tenantId" => "[azure][signinlogs][tenantId]"
      "resultType" => "[azure][signinlogs][resultType]"
      "resultSignature" => "[azure][signinlogs][resultSignature]"
      "resultDescription" => "[azure][signinlogs][resultDescription]"
      "durationMs" => "[azure][signinlogs][durationMs]"
      "callerIpAddress" => "[azure][signinlogs][callerIpAddress]"
      "correlationId" => "[azure][signinlogs][correlationId]"
      "identity" => "[azure][signinlogs][identity]"
      "Level" => "[azure][signinlogs][Level]"
      "location" => "[azure][signinlogs][location]"
      "properties" => "[azure][signinlogs][properties]"
    }
  }
  mutate {
    copy => {
      "[azure][signinlogs][properties][userPrincipalName]" => "[user][name]"
      "[azure][signinlogs][properties][userDisplayName]" => "[user][full_name]"
      "[azure][signinlogs][properties][userId]" => "[user][id]"
      "[azure][signinlogs][callerIpAddress]" => "[source][ip]"
      "[azure][signinlogs][resultType]" => "[error][code]"
      "[azure][signinlogs][resultDescription]" => "[error][message]"
      "[azure][signinlogs][properties][userAgent]" => "[user_agent][original]"
      "[azure][signinlogs][properties][location][countryOrRegion]" => "[source][geo][country_iso_code]"
      "[azure][signinlogs][properties][location][city]" => "[source][geo][city_name]"
      "[azure][signinlogs][correlationId]" => "[event][id]"
    }
    add_field => { "[event][action]" => "sign-in" "[cloud][provider]" => "azure" "[event][dataset]" => "azure.signinlogs" }
  }
  if [azure][signinlogs][resultType] == "0" {
    mutate { add_field => { "[event][outcome]" => "success" } remove_field => ["[error]"] }
  } else {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  }
  date { match => ["[azure][signinlogs][time]", "ISO8601"] target => "@timestamp" }
}

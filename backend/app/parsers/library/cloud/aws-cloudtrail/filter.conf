filter {
  mutate {
    rename => {
      "eventVersion" => "[aws][cloudtrail][eventVersion]"
      "userIdentity" => "[aws][cloudtrail][userIdentity]"
      "eventTime" => "[aws][cloudtrail][eventTime]"
      "eventSource" => "[aws][cloudtrail][eventSource]"
      "eventName" => "[aws][cloudtrail][eventName]"
      "awsRegion" => "[aws][cloudtrail][awsRegion]"
      "sourceIPAddress" => "[aws][cloudtrail][sourceIPAddress]"
      "userAgent" => "[aws][cloudtrail][userAgent]"
      "requestParameters" => "[aws][cloudtrail][requestParameters]"
      "responseElements" => "[aws][cloudtrail][responseElements]"
      "requestID" => "[aws][cloudtrail][requestID]"
      "eventID" => "[aws][cloudtrail][eventID]"
      "readOnly" => "[aws][cloudtrail][readOnly]"
      "eventType" => "[aws][cloudtrail][eventType]"
      "managementEvent" => "[aws][cloudtrail][managementEvent]"
      "recipientAccountId" => "[aws][cloudtrail][recipientAccountId]"
      "eventCategory" => "[aws][cloudtrail][eventCategory]"
      "errorCode" => "[aws][cloudtrail][errorCode]"
      "errorMessage" => "[aws][cloudtrail][errorMessage]"
      "tlsDetails" => "[aws][cloudtrail][tlsDetails]"
      "additionalEventData" => "[aws][cloudtrail][additionalEventData]"
      "resources" => "[aws][cloudtrail][resources]"
      "sessionCredentialFromConsole" => "[aws][cloudtrail][sessionCredentialFromConsole]"
      "apiVersion" => "[aws][cloudtrail][apiVersion]"
      "vpcEndpointId" => "[aws][cloudtrail][vpcEndpointId]"
    }
  }
  mutate {
    copy => {
      "[aws][cloudtrail][eventName]" => "[event][action]"
      "[aws][cloudtrail][eventSource]" => "[event][provider]"
      "[aws][cloudtrail][eventID]" => "[event][id]"
      "[aws][cloudtrail][awsRegion]" => "[cloud][region]"
      "[aws][cloudtrail][recipientAccountId]" => "[cloud][account][id]"
      "[aws][cloudtrail][userAgent]" => "[user_agent][original]"
      "[aws][cloudtrail][userIdentity][principalId]" => "[user][id]"
      "[aws][cloudtrail][userIdentity][userName]" => "[user][name]"
      "[aws][cloudtrail][errorCode]" => "[error][code]"
      "[aws][cloudtrail][errorMessage]" => "[error][message]"
    }
    add_field => { "[cloud][provider]" => "aws" "[event][dataset]" => "aws.cloudtrail" }
  }
  # Assumed roles / federated users have no userName: use the session name at the end of the ARN.
  if ![user][name] and [aws][cloudtrail][userIdentity][arn] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[aws][cloudtrail][userIdentity][arn]" => '/(?<[user][name]>[^/]+)$' }
    }
  }
  if [aws][cloudtrail][sourceIPAddress] =~ /^[0-9a-fA-F:.]+$/ {
    mutate { copy => { "[aws][cloudtrail][sourceIPAddress]" => "[source][ip]" } }
  }
  if [aws][cloudtrail][errorCode] {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  } else {
    mutate { add_field => { "[event][outcome]" => "success" } }
  }
  date { match => ["[aws][cloudtrail][eventTime]", "ISO8601"] target => "@timestamp" }
}

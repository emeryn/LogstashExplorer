filter {
  mutate {
    copy => {
      "ClientIP" => "[source][ip]"
      "ClientRequestHost" => "[url][domain]"
      "ClientRequestMethod" => "[http][request][method]"
      "ClientRequestURI" => "[url][original]"
      "EdgeResponseStatus" => "[http][response][status_code]"
      "EdgeResponseBytes" => "[http][response][body][bytes]"
      "ClientRequestUserAgent" => "[user_agent][original]"
      "ClientCountry" => "[source][geo][country_iso_code]"
      "SecurityAction" => "[event][action]"
      "RayID" => "[event][id]"
    }
    add_field => { "[event][dataset]" => "cloudflare.http_requests" }
  }
  mutate { uppercase => ["[source][geo][country_iso_code]"] }
  if [event][action] == "" {
    mutate { remove_field => ["[event][action]"] }
  }
  date { match => ["EdgeStartTimestamp", "ISO8601", "UNIX", "UNIX_MS"] target => "@timestamp" }
  mutate {
    rename => {
      "ClientIP" => "[cloudflare][ClientIP]" "ClientRequestHost" => "[cloudflare][ClientRequestHost]"
      "ClientRequestMethod" => "[cloudflare][ClientRequestMethod]" "ClientRequestURI" => "[cloudflare][ClientRequestURI]"
      "ClientRequestProtocol" => "[cloudflare][ClientRequestProtocol]" "ClientRequestUserAgent" => "[cloudflare][ClientRequestUserAgent]"
      "ClientCountry" => "[cloudflare][ClientCountry]" "EdgeResponseStatus" => "[cloudflare][EdgeResponseStatus]"
      "EdgeResponseBytes" => "[cloudflare][EdgeResponseBytes]" "EdgeStartTimestamp" => "[cloudflare][EdgeStartTimestamp]"
      "OriginResponseStatus" => "[cloudflare][OriginResponseStatus]" "RayID" => "[cloudflare][RayID]"
      "CacheCacheStatus" => "[cloudflare][CacheCacheStatus]" "SecurityAction" => "[cloudflare][SecurityAction]"
      "SecurityRuleID" => "[cloudflare][SecurityRuleID]" "WAFAttackScore" => "[cloudflare][WAFAttackScore]"
      "BotScore" => "[cloudflare][BotScore]" "ZoneName" => "[cloudflare][ZoneName]"
    }
  }
}

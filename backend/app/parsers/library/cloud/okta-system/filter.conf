filter {
  mutate {
    rename => {
      "uuid" => "[okta][uuid]"
      "published" => "[okta][published]"
      "eventType" => "[okta][eventType]"
      "version" => "[okta][version]"
      "severity" => "[okta][severity]"
      "legacyEventType" => "[okta][legacyEventType]"
      "displayMessage" => "[okta][displayMessage]"
      "actor" => "[okta][actor]"
      "client" => "[okta][client]"
      "outcome" => "[okta][outcome]"
      "target" => "[okta][target]"
      "transaction" => "[okta][transaction]"
      "debugContext" => "[okta][debugContext]"
      "authenticationContext" => "[okta][authenticationContext]"
      "securityContext" => "[okta][securityContext]"
      "request" => "[okta][request]"
    }
  }
  mutate {
    copy => {
      "[okta][uuid]" => "[event][id]"
      "[okta][eventType]" => "[event][action]"
      "[okta][displayMessage]" => "message"
      "[okta][actor][alternateId]" => "[user][name]"
      "[okta][actor][displayName]" => "[user][full_name]"
      "[okta][actor][id]" => "[user][id]"
      "[okta][client][ipAddress]" => "[source][ip]"
      "[okta][client][userAgent][rawUserAgent]" => "[user_agent][original]"
      "[okta][client][geographicalContext][city]" => "[source][geo][city_name]"
      "[okta][client][geographicalContext][country]" => "[source][geo][country_name]"
      "[okta][severity]" => "[log][level]"
    }
    add_field => { "[event][dataset]" => "okta.system" }
  }
  mutate { lowercase => ["[log][level]"] }
  translate {
    source => "[okta][outcome][result]"
    target => "[event][outcome]"
    dictionary => { "SUCCESS" => "success" "ALLOW" => "success" "FAILURE" => "failure" "DENY" => "failure" "CHALLENGE" => "unknown" "SKIPPED" => "unknown" }
    fallback => "unknown"
  }
  date { match => ["[okta][published]", "ISO8601"] target => "@timestamp" }
}

filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} )?filterlog(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[@metadata][csv]}' }
  }
  grok {
    ecs_compatibility => "v8"
    match => {
      "[@metadata][csv]" => [
        '^(?<[rule][id]>\d*),(?<[pfsense][subrule]>[^,]*),(?<[pfsense][anchor]>[^,]*),(?<[pfsense][tracker]>\d*),(?<[observer][ingress][interface][name]>[^,]*),(?<[pfsense][reason]>[^,]*),(?<[event][action]>[^,]*),(?<[network][direction]>[^,]*),4,(?<[pfsense][tos]>[^,]*),(?<[pfsense][ecn]>[^,]*),(?<[pfsense][ttl]>\d*),(?<[pfsense][id]>\d*),(?<[pfsense][offset]>\d*),(?<[pfsense][ip_flags]>[^,]*),(?<[network][iana_number]>\d+),(?<[network][transport]>[^,]*),(?<[pfsense][length]>\d+),(?<[source][ip]>[^,]+),(?<[destination][ip]>[^,]+)(?:,(?<[source][port]>\d+),(?<[destination][port]>\d+),(?<[pfsense][data_length]>\d+)(?:,(?<[pfsense][tcp_flags]>[^,]*),.*)?)?',
        '^(?<[rule][id]>\d*),(?<[pfsense][subrule]>[^,]*),(?<[pfsense][anchor]>[^,]*),(?<[pfsense][tracker]>\d*),(?<[observer][ingress][interface][name]>[^,]*),(?<[pfsense][reason]>[^,]*),(?<[event][action]>[^,]*),(?<[network][direction]>[^,]*),6,(?<[pfsense][class]>[^,]*),(?<[pfsense][flow_label]>[^,]*),(?<[pfsense][hop_limit]>\d*),(?<[network][transport]>[^,]*),(?<[network][iana_number]>\d+),(?<[pfsense][length]>\d+),(?<[source][ip]>[^,]+),(?<[destination][ip]>[^,]+)(?:,(?<[source][port]>\d+),(?<[destination][port]>\d+),(?<[pfsense][data_length]>\d+)(?:,(?<[pfsense][tcp_flags]>[^,]*),.*)?)?'
      ]
    }
  }
  if [@metadata][csv] =~ /^[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,6,/ {
    mutate { add_field => { "[network][type]" => "ipv6" } }
  } else {
    mutate { add_field => { "[network][type]" => "ipv4" } }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" }
    lowercase => ["[network][transport]"]
    add_field => { "[observer][type]" => "firewall" "[event][dataset]" => "pfsense.filterlog" }
  }
  translate {
    source => "[network][direction]"
    target => "[network][direction]"
    override => true
    dictionary => { "in" => "inbound" "out" => "outbound" }
  }
  if [event][action] in ["pass", "allow", "accept", "permit", "Allow", "Accept"] {
    mutate { add_field => { "[event][type]" => "allowed" } }
  } else if [event][action] in ["block", "deny", "drop", "reject", "Deny", "Drop", "Block", "Reject"] {
    mutate { add_field => { "[event][type]" => "denied" } }
  }
  date {
    match => ["[@metadata][syslog_timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
    target => "@timestamp"
  }
}

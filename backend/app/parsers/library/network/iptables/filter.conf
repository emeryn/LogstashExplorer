filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} kernel: )?(?:\[\s*%{NUMBER}\] )?(?:\[(?<[iptables][prefix]>[^\]]+)\] |(?<[iptables][prefix]>\S+?):? (?=IN=))?(?<[@metadata][kv]>IN=.*)$' }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[@metadata][nf]"
    field_split => " "
    value_split => "="
    whitespace => "strict"
  }
  mutate {
    copy => {
      "[@metadata][nf][IN]" => "[observer][ingress][interface][name]"
      "[@metadata][nf][OUT]" => "[observer][egress][interface][name]"
      "[@metadata][nf][SRC]" => "[source][ip]"
      "[@metadata][nf][DST]" => "[destination][ip]"
      "[@metadata][nf][PROTO]" => "[network][transport]"
      "[@metadata][nf][SPT]" => "[source][port]"
      "[@metadata][nf][DPT]" => "[destination][port]"
      "[@metadata][nf][TTL]" => "[iptables][ttl]"
      "[@metadata][nf][LEN]" => "[iptables][length]"
      "[@metadata][nf][MAC]" => "[iptables][mac]"
      "[@metadata][nf][ID]" => "[iptables][id]"
    }
    add_field => { "[observer][type]" => "firewall" "[event][dataset]" => "iptables.log" }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" "[iptables][ttl]" => "integer" }
    lowercase => ["[network][transport]"]
  }
  if [iptables][prefix] =~ /(?i)block|drop|deny|reject/ {
    mutate { add_field => { "[event][action]" => "deny" "[event][type]" => "denied" } }
  } else if [iptables][prefix] =~ /(?i)allow|accept|pass/ {
    mutate { add_field => { "[event][action]" => "allow" "[event][type]" => "allowed" } }
  }
  date { match => ["[@metadata][syslog_timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
}

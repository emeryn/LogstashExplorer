filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP} %{IPORHOST:[observer][hostname]} )?(?<[@metadata][csv]>\d+,\d{4}/\d{2}/\d{2} .*)$' }
  }
  if [@metadata][csv] =~ /^[^,]*,[^,]*,[^,]*,TRAFFIC,/ {
    csv {
      source => "[@metadata][csv]"
      target => "[panos]"
      skip_empty_columns => true
      columns => ["future_use1", "receive_time", "serial", "type", "subtype", "future_use2", "generated_time",
                  "src", "dst", "natsrc", "natdst", "rule", "srcuser", "dstuser", "app", "vsys", "from", "to",
                  "inbound_if", "outbound_if", "logset", "future_use3", "sessionid", "repeatcnt", "sport", "dport",
                  "natsport", "natdport", "flags", "proto", "action", "bytes", "bytes_sent", "bytes_received",
                  "packets", "start", "elapsed", "category", "future_use4", "seqno", "actionflags", "srcloc",
                  "dstloc", "future_use5", "pkts_sent", "pkts_received", "session_end_reason"]
    }
  } else if [@metadata][csv] =~ /^[^,]*,[^,]*,[^,]*,THREAT,/ {
    csv {
      source => "[@metadata][csv]"
      target => "[panos]"
      skip_empty_columns => true
      columns => ["future_use1", "receive_time", "serial", "type", "subtype", "future_use2", "generated_time",
                  "src", "dst", "natsrc", "natdst", "rule", "srcuser", "dstuser", "app", "vsys", "from", "to",
                  "inbound_if", "outbound_if", "logset", "future_use3", "sessionid", "repeatcnt", "sport", "dport",
                  "natsport", "natdport", "flags", "proto", "action", "misc", "threatid", "category", "severity",
                  "direction", "seqno", "actionflags", "srcloc", "dstloc", "future_use4", "contenttype", "pcap_id",
                  "filedigest", "cloud", "url_idx", "user_agent", "filetype", "xff", "referer"]
    }
  } else {
    csv {
      source => "[@metadata][csv]"
      target => "[panos]"
      skip_empty_columns => true
      columns => ["future_use1", "receive_time", "serial", "type", "subtype", "future_use2", "generated_time"]
    }
  }
  mutate { remove_field => ["[panos][future_use1]", "[panos][future_use2]", "[panos][future_use3]", "[panos][future_use4]", "[panos][future_use5]"] }
  # "0.0.0.0" / port 0 mean "no NAT".
  if [panos][natsrc] == "0.0.0.0" { mutate { remove_field => ["[panos][natsrc]", "[panos][natsport]"] } }
  if [panos][natdst] == "0.0.0.0" { mutate { remove_field => ["[panos][natdst]", "[panos][natdport]"] } }
  mutate {
    copy => {
      "[panos][serial]" => "[observer][serial_number]"
      "[panos][src]" => "[source][ip]"
      "[panos][dst]" => "[destination][ip]"
      "[panos][natsrc]" => "[source][nat][ip]"
      "[panos][natdst]" => "[destination][nat][ip]"
      "[panos][natsport]" => "[source][nat][port]"
      "[panos][natdport]" => "[destination][nat][port]"
      "[panos][rule]" => "[rule][name]"
      "[panos][srcuser]" => "[source][user][name]"
      "[panos][dstuser]" => "[destination][user][name]"
      "[panos][app]" => "[network][application]"
      "[panos][from]" => "[observer][ingress][zone]"
      "[panos][to]" => "[observer][egress][zone]"
      "[panos][inbound_if]" => "[observer][ingress][interface][name]"
      "[panos][outbound_if]" => "[observer][egress][interface][name]"
      "[panos][sport]" => "[source][port]"
      "[panos][dport]" => "[destination][port]"
      "[panos][proto]" => "[network][transport]"
      "[panos][action]" => "[event][action]"
      "[panos][bytes]" => "[network][bytes]"
      "[panos][bytes_sent]" => "[source][bytes]"
      "[panos][bytes_received]" => "[destination][bytes]"
      "[panos][packets]" => "[network][packets]"
      "[panos][sessionid]" => "[network][session_id]"
      "[panos][threatid]" => "[panos][threat_name]"
      "[panos][user_agent]" => "[user_agent][original]"
    }
    add_field => { "[observer][vendor]" => "Palo Alto Networks" "[observer][product]" => "PAN-OS" "[observer][type]" => "firewall" }
  }
  if [panos][type] == "THREAT" and [panos][misc] {
    mutate { copy => { "[panos][misc]" => "[url][original]" } }
  }
  mutate {
    convert => {
      "[source][port]" => "integer" "[destination][port]" => "integer" "[source][nat][port]" => "integer"
      "[destination][nat][port]" => "integer" "[network][bytes]" => "integer" "[source][bytes]" => "integer"
      "[destination][bytes]" => "integer" "[network][packets]" => "integer"
    }
  }
  date {
    match => ["[panos][generated_time]", "yyyy/MM/dd HH:mm:ss"]
    target => "@timestamp"
  }
}

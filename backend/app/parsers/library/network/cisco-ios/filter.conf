filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} )?(?:%{INT:[cisco][ios][sequence]:int}: )?(?:%{IPORHOST:[host][hostname]}: )?(?:[*.]?(?<[@metadata][timestamp]>%{MONTH} +%{MONTHDAY}(?: %{YEAR})? %{TIME})(?: (?<[cisco][ios][timezone]>[A-Z]{3,5}))?: )?%(?<[cisco][ios][facility]>[A-Z][A-Z0-9_]*)-(?<[log][syslog][severity][code]>[0-7])-(?<[event][code]>[A-Z][A-Z0-9_]*): %{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  mutate { convert => { "[log][syslog][severity][code]" => "integer" } }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => {
      "message" => [
        '^Login (?<[@metadata][login]>Success|failed) \[user: (?<[user][name]>[^\]]*)\] \[Source: %{IP:[source][ip]}\]',
        '^Configured from (?<[cisco][ios][config_source]>\S+) by (?<[user][name]>\S+)(?: on \S+ \(%{IP:[source][ip]}\))?',
        '^Interface (?<[cisco][ios][interface]>[^,]+), changed state to (?<[cisco][ios][state]>\S+)',
        '^Line protocol on Interface (?<[cisco][ios][interface]>[^,]+), changed state to (?<[cisco][ios][state]>\S+)'
      ]
    }
  }
  if [@metadata][login] == "Success" {
    mutate { add_field => { "[event][outcome]" => "success" "[event][action]" => "login" } }
  } else if [@metadata][login] == "failed" {
    mutate { add_field => { "[event][outcome]" => "failure" "[event][action]" => "login" } }
  } else if [event][code] == "CONFIG_I" {
    mutate { add_field => { "[event][action]" => "configuration-change" } }
  }
  mutate { add_field => { "[observer][vendor]" => "Cisco" "[event][dataset]" => "cisco.ios" } }
  date {
    match => ["[@metadata][timestamp]", "MMM dd HH:mm:ss.SSS", "MMM  d HH:mm:ss.SSS", "MMM dd yyyy HH:mm:ss.SSS", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
    target => "@timestamp"
  }
}

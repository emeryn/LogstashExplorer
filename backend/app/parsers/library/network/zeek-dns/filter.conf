filter {
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    add_field => { "[event][dataset]" => "zeek.dns" }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  mutate {
    rename => {
      "proto" => "[zeek][dns][proto]"
      "trans_id" => "[zeek][dns][trans_id]"
      "rtt" => "[zeek][dns][rtt]"
      "query" => "[zeek][dns][query]"
      "qclass" => "[zeek][dns][qclass]"
      "qclass_name" => "[zeek][dns][qclass_name]"
      "qtype" => "[zeek][dns][qtype]"
      "qtype_name" => "[zeek][dns][qtype_name]"
      "rcode" => "[zeek][dns][rcode]"
      "rcode_name" => "[zeek][dns][rcode_name]"
      "AA" => "[zeek][dns][AA]"
      "TC" => "[zeek][dns][TC]"
      "RD" => "[zeek][dns][RD]"
      "RA" => "[zeek][dns][RA]"
      "Z" => "[zeek][dns][Z]"
      "answers" => "[zeek][dns][answers]"
      "TTLs" => "[zeek][dns][TTLs]"
      "rejected" => "[zeek][dns][rejected]"
    }
  }
  mutate {
    copy => {
      "[zeek][dns][proto]" => "[network][transport]"
      "[zeek][dns][query]" => "[dns][question][name]"
      "[zeek][dns][qtype_name]" => "[dns][question][type]"
      "[zeek][dns][qclass_name]" => "[dns][question][class]"
      "[zeek][dns][rcode_name]" => "[dns][response_code]"
      "[zeek][dns][trans_id]" => "[dns][id]"
    }
  }
  mutate { lowercase => ["[network][transport]"] }
}

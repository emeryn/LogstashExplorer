filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?<[@metadata][prefix]>.*?)CEF:%{INT:[cef][version]}\|(?<[observer][vendor]>(?:[^|\\]|\\.)*)\|(?<[observer][product]>(?:[^|\\]|\\.)*)\|(?<[observer][version]>(?:[^|\\]|\\.)*)\|(?<[event][code]>(?:[^|\\]|\\.)*)\|(?<[cef][name]>(?:[^|\\]|\\.)*)\|(?<[cef][severity]>(?:[^|\\]|\\.)*)\|%{GREEDYDATA:[@metadata][extension]}'
    }
  }
  if [@metadata][extension] {
    # Values may contain spaces: a field ends where the next "key=" starts.
    kv {
      source => "[@metadata][extension]"
      target => "[cef][extensions]"
      field_split_pattern => " (?=[A-Za-z0-9_.\[\]-]+=)"
      value_split => "="
      include_brackets => false
    }
  }
  if [cef][extensions][cs1Label] and [cef][extensions][cs1] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cs1Label]}]" => "%{[cef][extensions][cs1]}" } }
  }
  if [cef][extensions][cs2Label] and [cef][extensions][cs2] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cs2Label]}]" => "%{[cef][extensions][cs2]}" } }
  }
  if [cef][extensions][cs3Label] and [cef][extensions][cs3] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cs3Label]}]" => "%{[cef][extensions][cs3]}" } }
  }
  if [cef][extensions][cs4Label] and [cef][extensions][cs4] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cs4Label]}]" => "%{[cef][extensions][cs4]}" } }
  }
  if [cef][extensions][cs5Label] and [cef][extensions][cs5] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cs5Label]}]" => "%{[cef][extensions][cs5]}" } }
  }
  if [cef][extensions][cs6Label] and [cef][extensions][cs6] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cs6Label]}]" => "%{[cef][extensions][cs6]}" } }
  }
  if [cef][extensions][cn1Label] and [cef][extensions][cn1] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cn1Label]}]" => "%{[cef][extensions][cn1]}" } }
  }
  if [cef][extensions][cn2Label] and [cef][extensions][cn2] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cn2Label]}]" => "%{[cef][extensions][cn2]}" } }
  }
  if [cef][extensions][cn3Label] and [cef][extensions][cn3] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][cn3Label]}]" => "%{[cef][extensions][cn3]}" } }
  }
  if [cef][extensions][flexString1Label] and [cef][extensions][flexString1] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][flexString1Label]}]" => "%{[cef][extensions][flexString1]}" } }
  }
  if [cef][extensions][flexString2Label] and [cef][extensions][flexString2] {
    mutate { add_field => { "[cef][labels][%{[cef][extensions][flexString2Label]}]" => "%{[cef][extensions][flexString2]}" } }
  }
  mutate {
    copy => {
      "[cef][extensions][src]" => "[source][ip]"
      "[cef][extensions][spt]" => "[source][port]"
      "[cef][extensions][dst]" => "[destination][ip]"
      "[cef][extensions][dpt]" => "[destination][port]"
      "[cef][extensions][suser]" => "[source][user][name]"
      "[cef][extensions][duser]" => "[destination][user][name]"
      "[cef][extensions][shost]" => "[source][domain]"
      "[cef][extensions][dhost]" => "[destination][domain]"
      "[cef][extensions][smac]" => "[source][mac]"
      "[cef][extensions][dmac]" => "[destination][mac]"
      "[cef][extensions][proto]" => "[network][transport]"
      "[cef][extensions][app]" => "[network][protocol]"
      "[cef][extensions][act]" => "[event][action]"
      "[cef][extensions][outcome]" => "[event][outcome]"
      "[cef][extensions][request]" => "[url][original]"
      "[cef][extensions][requestMethod]" => "[http][request][method]"
      "[cef][extensions][fname]" => "[file][name]"
      "[cef][extensions][filePath]" => "[file][path]"
      "[cef][extensions][dvchost]" => "[observer][hostname]"
      "[cef][extensions][dvc]" => "[observer][ip]"
      "[cef][extensions][deviceExternalId]" => "[observer][serial_number]"
      "[cef][extensions][msg]" => "[cef][message]"
    }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" }
    lowercase => ["[network][transport]", "[network][protocol]"]
  }
  # CEF escapes "=" and backslashes inside extension values: undo it on the fields mapped to ECS
  # (a Logstash string cannot end with a backslash, hence the look-ahead to drop one of each pair).
  mutate {
    gsub => [
      "[url][original]", "\\=", "=", "[url][original]", "\\(?=\\)", "",
      "[file][path]", "\\=", "=", "[file][path]", "\\(?=\\)", "",
      "[source][user][name]", "\\=", "=", "[source][user][name]", "\\(?=\\)", "",
      "[destination][user][name]", "\\=", "=", "[destination][user][name]", "\\(?=\\)", "",
      "[cef][message]", "\\=", "=", "[cef][message]", "\\(?=\\)", ""
    ]
  }
  if [cef][severity] =~ /^\d+$/ {
    mutate { copy => { "[cef][severity]" => "[event][severity]" } }
    mutate { convert => { "[event][severity]" => "integer" } }
  }
  if [cef][extensions][rt] =~ /^\d{12,13}$/ {
    date { match => ["[cef][extensions][rt]", "UNIX_MS"] target => "@timestamp" }
  } else if [cef][extensions][rt] {
    date {
      match => ["[cef][extensions][rt]", "MMM dd yyyy HH:mm:ss", "MMM dd yyyy HH:mm:ss.SSS", "MMM dd yyyy HH:mm:ss zzz", "MMM dd HH:mm:ss", "ISO8601"]
      target => "@timestamp"
    }
  }
}

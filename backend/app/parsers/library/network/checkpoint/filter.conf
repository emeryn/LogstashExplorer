filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => {
      "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:1 )?%{TIMESTAMP_ISO8601:[@metadata][timestamp]} %{IPORHOST:[host][hostname]} CheckPoint %{NOTSPACE} - \[%{GREEDYDATA:[@metadata][kv]}\]\s*$'
    }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[checkpoint]"
    field_split_pattern => ";\s*"
    value_split => ":"
  }
  mutate {
    copy => {
      "[checkpoint][origin]" => "[observer][ip]"
      "[checkpoint][src]" => "[source][ip]"
      "[checkpoint][dst]" => "[destination][ip]"
      "[checkpoint][s_port]" => "[source][port]"
      "[checkpoint][service]" => "[destination][port]"
      "[checkpoint][proto]" => "[network][iana_number]"
      "[checkpoint][action]" => "[event][action]"
      "[checkpoint][rule_name]" => "[rule][name]"
      "[checkpoint][rule_uid]" => "[rule][uuid]"
      "[checkpoint][ifdir]" => "[network][direction]"
      "[checkpoint][ifname]" => "[observer][ingress][interface][name]"
      "[checkpoint][inzone]" => "[observer][ingress][zone]"
      "[checkpoint][outzone]" => "[observer][egress][zone]"
      "[checkpoint][src_user_name]" => "[user][name]"
      "[checkpoint][xlatesrc]" => "[source][nat][ip]"
      "[checkpoint][xlatedst]" => "[destination][nat][ip]"
    }
    add_field => { "[observer][vendor]" => "Check Point" "[observer][type]" => "firewall" }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" }
    lowercase => ["[event][action]"]
  }
  if [checkpoint][time] {
    date { match => ["[checkpoint][time]", "UNIX"] target => "@timestamp" }
  } else {
    date { match => ["[@metadata][timestamp]", "ISO8601"] target => "@timestamp" }
  }
}

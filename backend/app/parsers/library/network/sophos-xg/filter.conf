filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?%{GREEDYDATA:[@metadata][kv]}' }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[sophos][xg]"
    field_split => " "
    value_split => "="
    whitespace => "strict"
  }
  mutate {
    copy => {
      "[sophos][xg][device_name]" => "[observer][name]"
      "[sophos][xg][log_id]" => "[event][code]"
      "[sophos][xg][status]" => "[event][action]"
      "[sophos][xg][fw_rule_id]" => "[rule][id]"
      "[sophos][xg][user_name]" => "[user][name]"
      "[sophos][xg][src_ip]" => "[source][ip]"
      "[sophos][xg][src_port]" => "[source][port]"
      "[sophos][xg][dst_ip]" => "[destination][ip]"
      "[sophos][xg][dst_port]" => "[destination][port]"
      "[sophos][xg][protocol]" => "[network][transport]"
      "[sophos][xg][tran_src_ip]" => "[source][nat][ip]"
      "[sophos][xg][srczone]" => "[observer][ingress][zone]"
      "[sophos][xg][dstzone]" => "[observer][egress][zone]"
      "[sophos][xg][in_interface]" => "[observer][ingress][interface][name]"
      "[sophos][xg][out_interface]" => "[observer][egress][interface][name]"
      "[sophos][xg][sent_bytes]" => "[source][bytes]"
      "[sophos][xg][recv_bytes]" => "[destination][bytes]"
    }
    add_field => { "[observer][vendor]" => "Sophos" "[observer][product]" => "XG Firewall" "[observer][type]" => "firewall" "[event][dataset]" => "sophos.xg" }
  }
  mutate {
    convert => {
      "[source][port]" => "integer" "[destination][port]" => "integer"
      "[source][bytes]" => "integer" "[destination][bytes]" => "integer"
    }
    lowercase => ["[network][transport]"]
  }
  if [event][action] in ["pass", "allow", "accept", "permit", "Allow", "Accept"] {
    mutate { add_field => { "[event][type]" => "allowed" } }
  } else if [event][action] in ["block", "deny", "drop", "reject", "Deny", "Drop", "Block", "Reject"] {
    mutate { add_field => { "[event][type]" => "denied" } }
  }
  mutate { add_field => { "[@metadata][timestamp]" => "%{[sophos][xg][date]} %{[sophos][xg][time]}" } }
  date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
}

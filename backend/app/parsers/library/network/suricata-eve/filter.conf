filter {
  mutate {
    rename => {
      "timestamp" => "[suricata][eve][timestamp]"
      "flow_id" => "[suricata][eve][flow_id]"
      "pcap_cnt" => "[suricata][eve][pcap_cnt]"
      "event_type" => "[suricata][eve][event_type]"
      "src_ip" => "[suricata][eve][src_ip]"
      "src_port" => "[suricata][eve][src_port]"
      "dest_ip" => "[suricata][eve][dest_ip]"
      "dest_port" => "[suricata][eve][dest_port]"
      "proto" => "[suricata][eve][proto]"
      "app_proto" => "[suricata][eve][app_proto]"
      "in_iface" => "[suricata][eve][in_iface]"
      "community_id" => "[suricata][eve][community_id]"
      "vlan" => "[suricata][eve][vlan]"
      "tx_id" => "[suricata][eve][tx_id]"
      "alert" => "[suricata][eve][alert]"
      "flow" => "[suricata][eve][flow]"
      "dns" => "[suricata][eve][dns]"
      "http" => "[suricata][eve][http]"
      "tls" => "[suricata][eve][tls]"
      "fileinfo" => "[suricata][eve][fileinfo]"
      "packet" => "[suricata][eve][packet]"
      "packet_info" => "[suricata][eve][packet_info]"
      "metadata" => "[suricata][eve][metadata]"
      "direction" => "[suricata][eve][direction]"
      "ether" => "[suricata][eve][ether]"
      "ssh" => "[suricata][eve][ssh]"
      "smb" => "[suricata][eve][smb]"
      "anomaly" => "[suricata][eve][anomaly]"
      "stats" => "[suricata][eve][stats]"
    }
  }
  mutate {
    copy => {
      "[suricata][eve][src_ip]" => "[source][ip]"
      "[suricata][eve][src_port]" => "[source][port]"
      "[suricata][eve][dest_ip]" => "[destination][ip]"
      "[suricata][eve][dest_port]" => "[destination][port]"
      "[suricata][eve][proto]" => "[network][transport]"
      "[suricata][eve][app_proto]" => "[network][protocol]"
      "[suricata][eve][community_id]" => "[network][community_id]"
      "[suricata][eve][in_iface]" => "[observer][ingress][interface][name]"
      "[suricata][eve][alert][signature_id]" => "[rule][id]"
      "[suricata][eve][alert][signature]" => "[rule][name]"
      "[suricata][eve][alert][category]" => "[rule][category]"
      "[suricata][eve][alert][severity]" => "[event][severity]"
      "[suricata][eve][alert][action]" => "[event][action]"
      "[suricata][eve][dns][rrname]" => "[dns][question][name]"
      "[suricata][eve][dns][queries][0][rrname]" => "[dns][question][name]"
      "[suricata][eve][dns][rrtype]" => "[dns][question][type]"
      "[suricata][eve][dns][queries][0][rrtype]" => "[dns][question][type]"
      "[suricata][eve][dns][rcode]" => "[dns][response_code]"
      "[suricata][eve][http][http_method]" => "[http][request][method]"
      "[suricata][eve][http][hostname]" => "[url][domain]"
      "[suricata][eve][http][url]" => "[url][original]"
      "[suricata][eve][http][http_user_agent]" => "[user_agent][original]"
      "[suricata][eve][http][status]" => "[http][response][status_code]"
      "[suricata][eve][tls][sni]" => "[tls][client][server_name]"
      "[suricata][eve][tls][version]" => "[tls][version]"
      "[suricata][eve][tls][subject]" => "[tls][server][subject]"
      "[suricata][eve][tls][issuerdn]" => "[tls][server][issuer]"
      "[suricata][eve][tls][ja3][hash]" => "[tls][client][ja3]"
    }
    add_field => { "[observer][type]" => "ids" "[event][dataset]" => "suricata.eve" }
  }
  mutate { lowercase => ["[network][transport]"] convert => { "[rule][id]" => "string" } }
  if [suricata][eve][event_type] == "alert" {
    mutate { add_field => { "[event][kind]" => "alert" } }
  } else {
    mutate { add_field => { "[event][kind]" => "event" } }
  }
  date {
    match => ["[suricata][eve][timestamp]", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ"]
    target => "@timestamp"
  }
}

filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{IPORHOST:[host][hostname]} openvpn(?:\[%{POSINT:[process][pid]:int}\])?: |(?<[@metadata][timestamp]>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME}) )(?:(?<[@metadata][cn]>[^/\s]+)/)?%{IP:[source][ip]}:%{INT:[source][port]:int} (?:\[(?<[@metadata][cn2]>[^\]]+)\] )?%{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][text] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { replace => { "message" => "%{[@metadata][text]}" } }
  }
  mutate { copy => { "[@metadata][cn]" => "[user][name]" } }
  if ![user][name] and [@metadata][cn2] {
    mutate { copy => { "[@metadata][cn2]" => "[user][name]" } }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    match => { "message" => 'pool returned IPv4=%{IP:[openvpn][vpn_ip]}' }
  }
  if [message] =~ /Peer Connection Initiated/ {
    mutate { add_field => { "[event][action]" => "connected" "[event][outcome]" => "success" } }
  } else if [message] =~ /(?i)verification failed|AUTH_FAILED|TLS Error/ {
    mutate { add_field => { "[event][action]" => "authentication" "[event][outcome]" => "failure" } }
  } else if [message] =~ /SIGTERM|client-instance exiting|Inactivity timeout/ {
    mutate { add_field => { "[event][action]" => "disconnected" } }
  }
  date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
  date { match => ["[@metadata][syslog_timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
  mutate { add_field => { "[event][dataset]" => "openvpn.log" } }
}

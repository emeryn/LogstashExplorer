filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?<[@metadata][kv]>id=firewall .*)$' }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[sonicwall]"
    field_split => " "
    value_split => "="
    whitespace => "strict"
  }
  if ![event][original] {
    mutate { copy => { "message" => "[event][original]" } }
  }
  mutate {
    copy => {
      "[sonicwall][sn]" => "[observer][serial_number]"
      "[sonicwall][m]" => "[event][code]"
      "[sonicwall][fw_action]" => "[event][action]"
      "[sonicwall][pri]" => "[sonicwall][priority]"
      "[sonicwall][sent]" => "[source][bytes]"
      "[sonicwall][rcvd]" => "[destination][bytes]"
    }
    replace => { "message" => "%{[sonicwall][msg]}" }
    add_field => { "[observer][vendor]" => "SonicWall" "[observer][type]" => "firewall" "[event][dataset]" => "sonicwall.firewall" }
  }
  grok {
    ecs_compatibility => "v8"
    tag_on_failure => []
    break_on_match => false
    match => {
      "[sonicwall][src]" => '^%{IP:[source][ip]}(?::%{INT:[source][port]:int})?(?::(?<[observer][ingress][interface][name]>[^:\s]+))?'
      "[sonicwall][dst]" => '^%{IP:[destination][ip]}(?::%{INT:[destination][port]:int})?(?::(?<[observer][egress][interface][name]>[^:\s]+))?'
      "[sonicwall][proto]" => '^(?<[network][transport]>[a-z0-9]+)(?:/(?<[network][protocol]>\S+))?'
    }
  }
  if [event][action] in ["NA", "\"NA\""] { mutate { remove_field => ["[event][action]"] } }
  mutate { convert => { "[source][bytes]" => "integer" "[destination][bytes]" => "integer" } }
  date { match => ["[sonicwall][time]", "yyyy-MM-dd HH:mm:ss zzz", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
}

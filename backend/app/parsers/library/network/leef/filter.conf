filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    match => {
      "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?.*?LEEF:%{NUMBER:[leef][version]}\|%{DATA:[observer][vendor]}\|%{DATA:[observer][product]}\|%{DATA:[observer][version]}\|%{DATA:[event][code]}\|(?:(?<[@metadata][delimiter]>x[0-9A-Fa-f]{2}|[^\s=|]{1,2})\|)?%{GREEDYDATA:[@metadata][attributes]}'
    }
  }
  if [@metadata][delimiter] in ["^", "x5E", "x5e"] {
    kv { source => "[@metadata][attributes]" target => "[leef][attributes]" field_split_pattern => "\^" value_split => "=" }
  } else if [@metadata][delimiter] in ["|", "x7C", "x7c"] {
    kv { source => "[@metadata][attributes]" target => "[leef][attributes]" field_split_pattern => "\|" value_split => "=" }
  } else {
    kv { source => "[@metadata][attributes]" target => "[leef][attributes]" field_split_pattern => "\t" value_split => "=" }
  }
  mutate {
    copy => {
      "[leef][attributes][src]" => "[source][ip]"
      "[leef][attributes][srcPort]" => "[source][port]"
      "[leef][attributes][dst]" => "[destination][ip]"
      "[leef][attributes][dstPort]" => "[destination][port]"
      "[leef][attributes][usrName]" => "[user][name]"
      "[leef][attributes][proto]" => "[network][transport]"
      "[leef][attributes][sev]" => "[event][severity]"
      "[leef][attributes][cat]" => "[leef][category]"
      "[leef][attributes][srcPreNAT]" => "[source][nat][ip]"
      "[leef][attributes][dstPreNAT]" => "[destination][nat][ip]"
      "[leef][attributes][identHostName]" => "[host][name]"
    }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" "[event][severity]" => "integer" }
    lowercase => ["[network][transport]"]
  }
  if [leef][attributes][devTime] {
    date {
      match => ["[leef][attributes][devTime]", "MMM dd yyyy HH:mm:ss", "MMM dd yyyy HH:mm:ss.SSS zzz", "ISO8601", "UNIX_MS"]
      target => "@timestamp"
    }
  }
}

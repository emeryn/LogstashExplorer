filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?1 %{TIMESTAMP_ISO8601:[@metadata][timestamp]} %{IPORHOST:[observer][hostname]} RT_FLOW - (?<[@metadata][tag]>RT_FLOW_[A-Z_]+) \[junos@[\d.]+ %{GREEDYDATA:[@metadata][kv]}\]\s*$' }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[juniper][srx]"
    field_split => " "
    value_split => "="
    whitespace => "strict"
  }
  mutate {
    copy => {
      "[juniper][srx][source-address]" => "[source][ip]"
      "[juniper][srx][source-port]" => "[source][port]"
      "[juniper][srx][destination-address]" => "[destination][ip]"
      "[juniper][srx][destination-port]" => "[destination][port]"
      "[juniper][srx][nat-source-address]" => "[source][nat][ip]"
      "[juniper][srx][nat-source-port]" => "[source][nat][port]"
      "[juniper][srx][nat-destination-address]" => "[destination][nat][ip]"
      "[juniper][srx][policy-name]" => "[rule][name]"
      "[juniper][srx][source-zone-name]" => "[observer][ingress][zone]"
      "[juniper][srx][destination-zone-name]" => "[observer][egress][zone]"
      "[juniper][srx][application]" => "[network][application]"
      "[juniper][srx][packet-incoming-interface]" => "[observer][ingress][interface][name]"
      "[juniper][srx][bytes-from-client]" => "[source][bytes]"
      "[juniper][srx][bytes-from-server]" => "[destination][bytes]"
      "[juniper][srx][protocol-id]" => "[network][iana_number]"
      "[@metadata][tag]" => "[juniper][srx][tag]"
    }
    add_field => { "[observer][vendor]" => "Juniper" "[observer][product]" => "SRX" "[observer][type]" => "firewall" "[event][dataset]" => "juniper.srx" }
  }
  if [juniper][srx][username] in ["N/A", ""] { mutate { remove_field => ["[juniper][srx][username]"] } } else {
    mutate { copy => { "[juniper][srx][username]" => "[user][name]" } }
  }
  translate {
    source => "[@metadata][tag]"
    target => "[event][action]"
    dictionary => { "RT_FLOW_SESSION_CREATE" => "session-create" "RT_FLOW_SESSION_CLOSE" => "session-close" "RT_FLOW_SESSION_DENY" => "session-deny" }
  }
  translate {
    source => "[@metadata][tag]"
    target => "[event][type]"
    dictionary => { "RT_FLOW_SESSION_CREATE" => "allowed" "RT_FLOW_SESSION_CLOSE" => "end" "RT_FLOW_SESSION_DENY" => "denied" }
  }
  if [source][nat][ip] == "0.0.0.0" { mutate { remove_field => ["[source][nat]"] } }
  mutate {
    convert => {
      "[source][port]" => "integer" "[destination][port]" => "integer" "[source][nat][port]" => "integer"
      "[source][bytes]" => "integer" "[destination][bytes]" => "integer"
    }
  }
  date { match => ["[@metadata][timestamp]", "ISO8601"] target => "@timestamp" }
}

filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?1 %{NUMBER:[@metadata][epoch]} (?<[observer][name]>\S+) (?<[@metadata][type]>\S+)\s+%{GREEDYDATA:[@metadata][text]}' }
  }
  if [@metadata][type] == "urls" {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[@metadata][text]" => "^src=%{IP:[source][ip]}:%{INT:[source][port]:int} dst=%{IP:[destination][ip]}:%{INT:[destination][port]:int} mac=(?<[source][mac]>\S+)(?: agent='(?<[user_agent][original]>[^']*)')? request: %{WORD:[http][request][method]} %{NOTSPACE:[url][original]}" }
    }
  } else {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => { "[@metadata][text]" => '^(?<[@metadata][kv]>.*?)(?: pattern: (?<[event][action]>allow|deny)(?: (?<[meraki][pattern]>.*))?)?$' }
    }
    kv {
      source => "[@metadata][kv]"
      target => "[meraki]"
      field_split => " "
      value_split => "="
      whitespace => "strict"
    }
    mutate {
      copy => {
        "[meraki][src]" => "[source][ip]"
        "[meraki][dst]" => "[destination][ip]"
        "[meraki][sport]" => "[source][port]"
        "[meraki][dport]" => "[destination][port]"
        "[meraki][protocol]" => "[network][transport]"
        "[meraki][mac]" => "[source][mac]"
      }
    }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" }
    copy => { "[@metadata][type]" => "[meraki][type]" }
    add_field => { "[observer][vendor]" => "Cisco Meraki" "[event][dataset]" => "meraki.%{[@metadata][type]}" }
  }
  if [event][action] in ["pass", "allow", "accept", "permit", "Allow", "Accept"] {
    mutate { add_field => { "[event][type]" => "allowed" } }
  } else if [event][action] in ["block", "deny", "drop", "reject", "Deny", "Drop", "Block", "Reject"] {
    mutate { add_field => { "[event][type]" => "denied" } }
  }
  date { match => ["[@metadata][epoch]", "UNIX"] target => "@timestamp" }
}

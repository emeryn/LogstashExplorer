filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?%{GREEDYDATA:[@metadata][kv]}' }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[fortinet][firewall]"
    field_split => " "
    value_split => "="
  }
  mutate {
    copy => {
      "[fortinet][firewall][devname]" => "[observer][name]"
      "[fortinet][firewall][devid]" => "[observer][serial_number]"
      "[fortinet][firewall][logid]" => "[event][code]"
      "[fortinet][firewall][srcip]" => "[source][ip]"
      "[fortinet][firewall][srcport]" => "[source][port]"
      "[fortinet][firewall][dstip]" => "[destination][ip]"
      "[fortinet][firewall][dstport]" => "[destination][port]"
      "[fortinet][firewall][srcintf]" => "[observer][ingress][interface][name]"
      "[fortinet][firewall][dstintf]" => "[observer][egress][interface][name]"
      "[fortinet][firewall][policyid]" => "[rule][id]"
      "[fortinet][firewall][policyname]" => "[rule][name]"
      "[fortinet][firewall][action]" => "[event][action]"
      "[fortinet][firewall][sentbyte]" => "[source][bytes]"
      "[fortinet][firewall][rcvdbyte]" => "[destination][bytes]"
      "[fortinet][firewall][user]" => "[user][name]"
      "[fortinet][firewall][srcip6]" => "[source][ip]"
      "[fortinet][firewall][level]" => "[log][level]"
      "[fortinet][firewall][app]" => "[network][application]"
      "[fortinet][firewall][msg]" => "[fortinet][firewall][message]"
    }
    add_field => { "[observer][vendor]" => "Fortinet" "[observer][product]" => "FortiGate" "[observer][type]" => "firewall" }
  }
  mutate {
    convert => {
      "[source][port]" => "integer" "[destination][port]" => "integer"
      "[source][bytes]" => "integer" "[destination][bytes]" => "integer"
    }
  }
  if [event][action] in ["accept", "close", "server-rst", "client-rst", "timeout", "pass", "passthrough"] {
    mutate { add_field => { "[event][type]" => "allowed" } }
  } else if [event][action] in ["deny", "block", "blocked", "dropped", "ip-conn"] {
    mutate { add_field => { "[event][type]" => "denied" } }
  }
  if [fortinet][firewall][tz] {
    mutate { add_field => { "[@metadata][timestamp]" => "%{[fortinet][firewall][date]} %{[fortinet][firewall][time]} %{[fortinet][firewall][tz]}" } }
    date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss Z"] target => "@timestamp" }
  } else if [fortinet][firewall][date] {
    mutate { add_field => { "[@metadata][timestamp]" => "%{[fortinet][firewall][date]} %{[fortinet][firewall][time]}" } }
    date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
  }
}

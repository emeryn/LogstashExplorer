filter {
  # Inputs without ECS (stdin, tcp…) store the sender as a plain `host` string: keep it aside for host.*.
  if [host] =~ /./ {
    mutate { rename => { "host" => "[@metadata][input_host]" } }
  }
  grok {
    ecs_compatibility => "v8"
    overwrite => ["[host][hostname]"]
    match => {
      "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:(?<[@metadata][timestamp]>%{MONTH} +%{MONTHDAY}(?: %{YEAR})? %{TIME})(?: %{IPORHOST:[host][hostname]})? ?: )?%(?<[observer][product]>ASA|FTD|FWSM|PIX)-%{INT:[log][syslog][severity][code]:int}-%{INT:[event][code]}: %{GREEDYDATA:[@metadata][text]}'
    }
  }
  if [@metadata][text] {
    grok {
      ecs_compatibility => "v8"
      tag_on_failure => []
      match => {
        "[@metadata][text]" => [
          '^(?<[@metadata][verb]>Built) (?<[network][direction]>inbound|outbound) %{WORD:[network][transport]} connection %{INT:[cisco][asa][connection_id]} for %{DATA:[@metadata][a_if]}:%{IP:[@metadata][a_ip]}/%{INT:[@metadata][a_port]:int} \(%{IP:[@metadata][a_nat_ip]}/%{INT:[@metadata][a_nat_port]:int}\)(?:\(%{DATA}\))? to %{DATA:[@metadata][b_if]}:%{IP:[@metadata][b_ip]}/%{INT:[@metadata][b_port]:int} \(%{IP:[@metadata][b_nat_ip]}/%{INT:[@metadata][b_nat_port]:int}\)',
          '^(?<[@metadata][verb]>Teardown) %{WORD:[network][transport]} connection %{INT:[cisco][asa][connection_id]} for %{DATA:[@metadata][a_if]}:%{IP:[@metadata][a_ip]}/%{INT:[@metadata][a_port]:int} to %{DATA:[@metadata][b_if]}:%{IP:[@metadata][b_ip]}/%{INT:[@metadata][b_port]:int}(?: duration %{TIME:[cisco][asa][duration]} bytes %{INT:[network][bytes]:int})?(?: %{GREEDYDATA:[cisco][asa][termination_reason]})?',
          '^(?<[@metadata][verb]>Deny) %{WORD:[network][transport]} src %{DATA:[observer][ingress][interface][name]}:%{IP:[source][ip]}(?:/%{INT:[source][port]:int})? dst %{DATA:[observer][egress][interface][name]}:%{IP:[destination][ip]}(?:/%{INT:[destination][port]:int})?(?: \(type %{INT:[cisco][asa][icmp_type]:int}, code %{INT:[cisco][asa][icmp_code]:int}\))? by access-group "%{DATA:[rule][name]}"',
          '^access-list %{NOTSPACE:[rule][name]} (?<[@metadata][verb]>permitted|denied|est-allowed) %{WORD:[network][transport]} %{DATA:[observer][ingress][interface][name]}/%{IP:[source][ip]}\(%{INT:[source][port]:int}\)(?:\(%{DATA}\))? -> %{DATA:[observer][egress][interface][name]}/%{IP:[destination][ip]}\(%{INT:[destination][port]:int}\)',
          '^Login (?<[@metadata][verb]>permitted|denied) from %{IP:[source][ip]}/%{INT:[source][port]:int} to %{DATA:[observer][ingress][interface][name]}:%{IP:[destination][ip]}/%{WORD:[network][protocol]}(?: for user "%{DATA:[user][name]}")?',
          '^AAA user authentication (?<[@metadata][verb]>Successful|Rejected)(?: : reason = %{DATA:[cisco][asa][reason]})? : server = +%{IP:[cisco][asa][aaa_server]} : user = %{DATA:[user][name]}(?: : user IP = %{IP:[source][ip]})?$'
        ]
      }
    }
  }
  # Build/teardown messages name the outside peer first for outbound connections.
  if [@metadata][a_ip] {
    if [network][direction] == "outbound" {
      mutate {
        rename => {
          "[@metadata][a_ip]" => "[destination][ip]" "[@metadata][a_port]" => "[destination][port]"
          "[@metadata][a_nat_ip]" => "[destination][nat][ip]" "[@metadata][a_nat_port]" => "[destination][nat][port]"
          "[@metadata][a_if]" => "[observer][egress][interface][name]"
          "[@metadata][b_ip]" => "[source][ip]" "[@metadata][b_port]" => "[source][port]"
          "[@metadata][b_nat_ip]" => "[source][nat][ip]" "[@metadata][b_nat_port]" => "[source][nat][port]"
          "[@metadata][b_if]" => "[observer][ingress][interface][name]"
        }
      }
    } else {
      mutate {
        rename => {
          "[@metadata][a_ip]" => "[source][ip]" "[@metadata][a_port]" => "[source][port]"
          "[@metadata][a_nat_ip]" => "[source][nat][ip]" "[@metadata][a_nat_port]" => "[source][nat][port]"
          "[@metadata][a_if]" => "[observer][ingress][interface][name]"
          "[@metadata][b_ip]" => "[destination][ip]" "[@metadata][b_port]" => "[destination][port]"
          "[@metadata][b_nat_ip]" => "[destination][nat][ip]" "[@metadata][b_nat_port]" => "[destination][nat][port]"
          "[@metadata][b_if]" => "[observer][egress][interface][name]"
        }
      }
    }
  }
  translate {
    source => "[@metadata][verb]"
    target => "[event][action]"
    dictionary => {
      "Built" => "connection-built" "Teardown" => "connection-teardown" "Deny" => "denied" "denied" => "denied"
      "permitted" => "permitted" "est-allowed" => "permitted" "Successful" => "authentication" "Rejected" => "authentication"
    }
  }
  translate {
    source => "[@metadata][verb]"
    target => "[event][outcome]"
    dictionary => {
      "Built" => "success" "Teardown" => "success" "Deny" => "failure" "denied" => "failure" "permitted" => "success"
      "est-allowed" => "success" "Successful" => "success" "Rejected" => "failure"
    }
  }
  mutate {
    lowercase => ["[network][transport]"]
    add_field => { "[observer][vendor]" => "Cisco" "[observer][type]" => "firewall" }
  }
  date {
    match => ["[@metadata][timestamp]", "MMM dd yyyy HH:mm:ss", "MMM  d yyyy HH:mm:ss", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    add_field => { "[event][dataset]" => "zeek.conn" }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  mutate {
    rename => {
      "proto" => "[zeek][conn][proto]"
      "service" => "[zeek][conn][service]"
      "duration" => "[zeek][conn][duration]"
      "orig_bytes" => "[zeek][conn][orig_bytes]"
      "resp_bytes" => "[zeek][conn][resp_bytes]"
      "conn_state" => "[zeek][conn][conn_state]"
      "local_orig" => "[zeek][conn][local_orig]"
      "local_resp" => "[zeek][conn][local_resp]"
      "missed_bytes" => "[zeek][conn][missed_bytes]"
      "history" => "[zeek][conn][history]"
      "orig_pkts" => "[zeek][conn][orig_pkts]"
      "orig_ip_bytes" => "[zeek][conn][orig_ip_bytes]"
      "resp_pkts" => "[zeek][conn][resp_pkts]"
      "resp_ip_bytes" => "[zeek][conn][resp_ip_bytes]"
      "tunnel_parents" => "[zeek][conn][tunnel_parents]"
    }
  }
  mutate {
    copy => {
      "[zeek][conn][proto]" => "[network][transport]"
      "[zeek][conn][service]" => "[network][protocol]"
      "[zeek][conn][orig_bytes]" => "[source][bytes]"
      "[zeek][conn][resp_bytes]" => "[destination][bytes]"
      "[zeek][conn][orig_pkts]" => "[source][packets]"
      "[zeek][conn][resp_pkts]" => "[destination][packets]"
    }
  }
  mutate { lowercase => ["[network][transport]"] }
}

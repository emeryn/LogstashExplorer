filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?<[@metadata][timestamp]>\d{2}/\d{2}(?:/\d{2})?-\d{2}:\d{2}:\d{2}\.\d+) +\[\*\*\] \[(?<[snort][gid]>\d+):(?<[rule][id]>\d+):(?<[rule][version]>\d+)\] "?(?<[rule][name]>.*?)"? \[\*\*\](?: \[Classification: (?<[rule][category]>[^\]]*)\])?(?: \[Priority: %{INT:[event][severity]:int}\])? \{(?<[network][transport]>[^}]+)\} %{IP:[source][ip]}(?::%{INT:[source][port]:int})? -> %{IP:[destination][ip]}(?::%{INT:[destination][port]:int})?' }
  }
  mutate {
    lowercase => ["[network][transport]"]
    add_field => { "[event][kind]" => "alert" "[observer][type]" => "ids" "[event][dataset]" => "snort.alert" }
  }
  date { match => ["[@metadata][timestamp]", "MM/dd-HH:mm:ss.SSSSSS", "MM/dd/yy-HH:mm:ss.SSSSSS"] target => "@timestamp" }
}

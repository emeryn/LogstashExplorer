filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP} \S+ )?(?<[@metadata][kv]>id=firewall .*)$' }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[stormshield]"
    field_split => " "
    value_split => "="
  }
  mutate {
    copy => {
      "[stormshield][fw]" => "[observer][name]"
      "[stormshield][src]" => "[source][ip]"
      "[stormshield][srcport]" => "[source][port]"
      "[stormshield][dst]" => "[destination][ip]"
      "[stormshield][dstport]" => "[destination][port]"
      "[stormshield][ipproto]" => "[network][transport]"
      "[stormshield][proto]" => "[network][protocol]"
      "[stormshield][action]" => "[event][action]"
      "[stormshield][ruleid]" => "[rule][id]"
      "[stormshield][srcifname]" => "[observer][ingress][interface][name]"
      "[stormshield][dstifname]" => "[observer][egress][interface][name]"
      "[stormshield][sent]" => "[source][bytes]"
      "[stormshield][rcvd]" => "[destination][bytes]"
      "[stormshield][user]" => "[user][name]"
      "[stormshield][alarmid]" => "[event][code]"
      "[stormshield][msg]" => "[stormshield][message]"
    }
    add_field => { "[observer][vendor]" => "Stormshield" "[observer][product]" => "SNS" "[observer][type]" => "firewall" }
  }
  mutate {
    convert => {
      "[source][port]" => "integer" "[destination][port]" => "integer"
      "[source][bytes]" => "integer" "[destination][bytes]" => "integer"
    }
  }
  if [stormshield][tz] {
    mutate { add_field => { "[@metadata][timestamp]" => "%{[stormshield][time]} %{[stormshield][tz]}" } }
    date { match => ["[@metadata][timestamp]", "yyyy-MM-dd HH:mm:ss Z"] target => "@timestamp" }
  } else {
    date { match => ["[stormshield][time]", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
  }
}

filter {
  grok {
    ecs_compatibility => "v8"
    match => { "message" => '^(?:<%{NONNEGINT:[log][syslog][priority]:int}>)?(?:%{SYSLOGTIMESTAMP} \S+ )?ASM:%{GREEDYDATA:[@metadata][kv]}$' }
  }
  kv {
    source => "[@metadata][kv]"
    target => "[f5][asm]"
    field_split => ","
    value_split => "="
    whitespace => "strict"
  }
  mutate {
    copy => {
      "[f5][asm][unit_hostname]" => "[observer][hostname]"
      "[f5][asm][policy_name]" => "[rule][ruleset]"
      "[f5][asm][request_status]" => "[event][action]"
      "[f5][asm][support_id]" => "[event][id]"
      "[f5][asm][ip_client]" => "[source][ip]"
      "[f5][asm][src_port]" => "[source][port]"
      "[f5][asm][dest_ip]" => "[destination][ip]"
      "[f5][asm][dest_port]" => "[destination][port]"
      "[f5][asm][method]" => "[http][request][method]"
      "[f5][asm][uri]" => "[url][path]"
      "[f5][asm][query_string]" => "[url][query]"
      "[f5][asm][severity]" => "[log][level]"
      "[f5][asm][response_code]" => "[http][response][status_code]"
    }
    add_field => { "[observer][vendor]" => "F5" "[observer][product]" => "BIG-IP ASM" "[observer][type]" => "waf" "[event][dataset]" => "f5.asm" }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" "[http][response][status_code]" => "integer" }
    lowercase => ["[log][level]"]
  }
  if [url][query] == "" { mutate { remove_field => ["[url][query]"] } }
  date { match => ["[f5][asm][date_time]", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
}

filter {
  mutate {
    copy => {
      "[id.orig_h]" => "[source][ip]"
      "[id.orig_p]" => "[source][port]"
      "[id.resp_h]" => "[destination][ip]"
      "[id.resp_p]" => "[destination][port]"
      "[id][orig_h]" => "[source][ip]"
      "[id][orig_p]" => "[source][port]"
      "[id][resp_h]" => "[destination][ip]"
      "[id][resp_p]" => "[destination][port]"
      "uid" => "[zeek][session_id]"
    }
  }
  mutate {
    remove_field => ["[id.orig_h]", "[id.orig_p]", "[id.resp_h]", "[id.resp_p]", "id", "uid"]
    add_field => { "[event][dataset]" => "zeek.ssl" }
  }
  date {
    match => ["ts", "UNIX", "ISO8601"]
    target => "@timestamp"
    remove_field => ["ts"]
  }
  mutate {
    rename => {
      "version" => "[zeek][ssl][version]"
      "cipher" => "[zeek][ssl][cipher]"
      "curve" => "[zeek][ssl][curve]"
      "server_name" => "[zeek][ssl][server_name]"
      "resumed" => "[zeek][ssl][resumed]"
      "last_alert" => "[zeek][ssl][last_alert]"
      "next_protocol" => "[zeek][ssl][next_protocol]"
      "established" => "[zeek][ssl][established]"
      "ssl_history" => "[zeek][ssl][ssl_history]"
      "cert_chain_fps" => "[zeek][ssl][cert_chain_fps]"
      "client_cert_chain_fps" => "[zeek][ssl][client_cert_chain_fps]"
      "subject" => "[zeek][ssl][subject]"
      "issuer" => "[zeek][ssl][issuer]"
      "validation_status" => "[zeek][ssl][validation_status]"
      "ja3" => "[zeek][ssl][ja3]"
      "ja3s" => "[zeek][ssl][ja3s]"
      "sni_matches_cert" => "[zeek][ssl][sni_matches_cert]"
    }
  }
  mutate {
    copy => {
      "[zeek][ssl][version]" => "[tls][version]"
      "[zeek][ssl][cipher]" => "[tls][cipher]"
      "[zeek][ssl][curve]" => "[tls][curve]"
      "[zeek][ssl][server_name]" => "[tls][client][server_name]"
      "[zeek][ssl][established]" => "[tls][established]"
      "[zeek][ssl][resumed]" => "[tls][resumed]"
      "[zeek][ssl][subject]" => "[tls][server][subject]"
      "[zeek][ssl][issuer]" => "[tls][server][issuer]"
      "[zeek][ssl][ja3]" => "[tls][client][ja3]"
      "[zeek][ssl][ja3s]" => "[tls][server][ja3s]"
    }
  }
  mutate { lowercase => ["[network][transport]"] }
}

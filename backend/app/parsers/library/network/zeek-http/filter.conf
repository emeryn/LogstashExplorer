filter {
  # http.log has a `host` key (the Host header): decoding it at the input would collide with the
  # host.* object added by ECS inputs, so the file is read as lines and decoded here.
  json {
    source => "message"
    target => "[@metadata][z]"
  }
  if [@metadata][z][uid] {
    if ![event][original] {
      mutate { copy => { "message" => "[event][original]" } }
    }
    mutate { remove_field => ["message"] }
    mutate {
      copy => {
        "[@metadata][z][id.orig_h]" => "[source][ip]"
        "[@metadata][z][id.orig_p]" => "[source][port]"
        "[@metadata][z][id.resp_h]" => "[destination][ip]"
        "[@metadata][z][id.resp_p]" => "[destination][port]"
        "[@metadata][z][uid]" => "[zeek][session_id]"
        "[@metadata][z][method]" => "[http][request][method]"
        "[@metadata][z][host]" => "[url][domain]"
        "[@metadata][z][uri]" => "[url][original]"
        "[@metadata][z][referrer]" => "[http][request][referrer]"
        "[@metadata][z][version]" => "[http][version]"
        "[@metadata][z][user_agent]" => "[user_agent][original]"
        "[@metadata][z][request_body_len]" => "[http][request][body][bytes]"
        "[@metadata][z][response_body_len]" => "[http][response][body][bytes]"
        "[@metadata][z][status_code]" => "[http][response][status_code]"
      }
      add_field => { "[event][dataset]" => "zeek.http" }
    }
    mutate {
      copy => {
        "[@metadata][z][trans_depth]" => "[zeek][http][trans_depth]"
        "[@metadata][z][method]" => "[zeek][http][method]"
        "[@metadata][z][host]" => "[zeek][http][host]"
        "[@metadata][z][uri]" => "[zeek][http][uri]"
        "[@metadata][z][referrer]" => "[zeek][http][referrer]"
        "[@metadata][z][version]" => "[zeek][http][version]"
        "[@metadata][z][user_agent]" => "[zeek][http][user_agent]"
        "[@metadata][z][origin]" => "[zeek][http][origin]"
        "[@metadata][z][request_body_len]" => "[zeek][http][request_body_len]"
        "[@metadata][z][response_body_len]" => "[zeek][http][response_body_len]"
        "[@metadata][z][status_code]" => "[zeek][http][status_code]"
        "[@metadata][z][status_msg]" => "[zeek][http][status_msg]"
        "[@metadata][z][info_code]" => "[zeek][http][info_code]"
        "[@metadata][z][info_msg]" => "[zeek][http][info_msg]"
        "[@metadata][z][tags]" => "[zeek][http][tags]"
        "[@metadata][z][username]" => "[zeek][http][username]"
        "[@metadata][z][proxied]" => "[zeek][http][proxied]"
        "[@metadata][z][orig_fuids]" => "[zeek][http][orig_fuids]"
        "[@metadata][z][orig_filenames]" => "[zeek][http][orig_filenames]"
        "[@metadata][z][orig_mime_types]" => "[zeek][http][orig_mime_types]"
        "[@metadata][z][resp_fuids]" => "[zeek][http][resp_fuids]"
        "[@metadata][z][resp_filenames]" => "[zeek][http][resp_filenames]"
        "[@metadata][z][resp_mime_types]" => "[zeek][http][resp_mime_types]"
      }
    }
    date { match => ["[@metadata][z][ts]", "UNIX", "ISO8601"] target => "@timestamp" }
  }
}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logstash-explorer
resources:
  - namespace.yaml
  - postgres.yaml
  - runner.yaml
  - backend.yaml
  - frontend.yaml
  - networkpolicies.yaml
# Point to your registry (images are built from this repository):
images:
  - name: logstash-explorer/backend
    newName: registry.example.org/logstash-explorer/backend
    newTag: "0.1.0"
  - name: logstash-explorer/runner
    newName: registry.example.org/logstash-explorer/runner
    newTag: "0.1.0"
  - name: logstash-explorer/frontend
    newName: registry.example.org/logstash-explorer/frontend
    newTag: "0.1.0"

apiVersion: v1
kind: Namespace
metadata:
  name: logstash-explorer
  labels:
    # Kubernetes Pod Security Standards: "restricted" (non-root, no privilege escalation,
    # all capabilities dropped, seccomp RuntimeDefault) is enforced for every pod.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

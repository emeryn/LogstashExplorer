apiVersion: v1
kind: Service
metadata: { name: backend, labels: { app: backend } }
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: backups }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pki }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 64Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 1 # RWO volumes; scheduled jobs are protected by PostgreSQL advisory locks if scaled
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: logstash-explorer/backend
          env:
            - { name: LSX_PUBLIC_URL, value: "https://explorer.example.org" }
            - { name: LSX_WEBAUTHN_RP_ID, value: "explorer.example.org" }
            - { name: LSX_DB_HOST, value: db }
            - { name: LSX_RUNNER_URL, value: "http://runner:8700" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: backups, mountPath: /backups }
            - { name: pki, mountPath: /pki }
            - { name: secret-db, mountPath: /run/lsx-secrets/db, readOnly: true }
            - { name: secret-app, mountPath: /run/lsx-secrets/app, readOnly: true }
            - { name: secret-runner, mountPath: /run/lsx-secrets/runner, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: backups, persistentVolumeClaim: { claimName: backups } }
        - { name: pki, persistentVolumeClaim: { claimName: pki } }
        - { name: secret-db, secret: { secretName: lsx-db, defaultMode: 0440 } }
        - { name: secret-app, secret: { secretName: lsx-app, defaultMode: 0440 } }
        - { name: secret-runner, secret: { secretName: lsx-runner, defaultMode: 0440 } }

# Front proxy (inside the container network). TLS is terminated by a reverse proxy in front of it —
# see the README (§6) for a post-quantum hybrid TLS Nginx example.
server_tokens off;

# Per-IP throttling of password endpoints. Sized for many colleagues behind one corporate NAT/proxy;
# per-account lockout (5 failures) remains the main brute-force control.
limit_req_zone $binary_remote_addr zone=lsx_login:10m rate=30r/m;
limit_req_status 429;

upstream lsx_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    client_body_timeout 30s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA entry point: the CSP nonce placeholder is replaced per response.
    location = /index.html {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter "__CSP_NONCE__" "$request_id";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Brute-force throttling on password endpoints (in addition to account lockout).
    location ~ ^/api/auth/(login|ldap/login|mfa/) {
        limit_req zone=lsx_login burst=20 nodelay;
        proxy_pass http://lsx_backend;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://lsx_backend;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

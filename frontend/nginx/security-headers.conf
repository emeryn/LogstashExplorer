# Included in every location (add_header is not inherited once a location defines its own).
# script-src: strict, no inline at all. <style> elements: per-response nonce ($request_id, 128 random bits).
# style-src-attr 'unsafe-inline': ONLY style *attributes* — Monaco renders editor lines as HTML with
# style="top:…px" (values too dynamic for hashes). Attributes cannot run code; img-src blocks url() exfiltration.
# img-src data: is required by Monaco's squiggly-underline SVGs (images cannot execute code).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id'; style-src-elem 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), publickey-credentials-create=(self), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
